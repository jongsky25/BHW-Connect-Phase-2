<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BHW Reference Manual · Assessor journey preview</title>
<style>
:root{color-scheme:light dark;--bg:#f8f7f2;--card:#fff;--ink:#263b37;--muted:#526760;--line:#d8e1db;--accent:#ffd65a;--green:#185f50;--tint:#e8f4ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}header{background:var(--green);color:white;padding:20px max(20px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{font-size:18px}button,select,textarea,input{font:inherit}button{min-height:44px;border:1px solid var(--line);border-radius:9px;padding:9px 16px;background:var(--card);color:var(--ink);cursor:pointer}button:hover{border-color:var(--green)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ca9100;outline-offset:3px}button:disabled{opacity:.6;cursor:not-allowed}.primary{background:var(--accent);border-color:var(--accent);color:#263b37;font-weight:650}.wrap{max-width:1140px;margin:auto;padding:24px 20px}.notice{font-size:14px;border-left:4px solid #c58b00;padding:10px 15px;background:var(--card)}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}nav button[aria-current=page]{background:var(--green);color:white}h1{font-size:clamp(26px,4vw,36px);line-height:1.2;margin:12px 0}h2{font-size:21px;margin:0 0 10px}h3{font-size:17px;margin:0 0 5px}p{margin:7px 0 16px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:24px;margin:16px 0}.chip{display:inline-block;font-size:13px;font-weight:650;border-radius:20px;padding:4px 10px;background:var(--tint);color:var(--green)}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.stack{display:grid;gap:14px}.step{padding:12px 0;border-bottom:1px solid var(--line)}.step:last-child{border:0}progress{width:100%;height:13px;accent-color:var(--green)}.toolbar{display:flex;align-items:end;gap:14px;flex-wrap:wrap}label{display:block}select,input,textarea{display:block;width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--card);color:var(--ink);min-height:44px}fieldset{border:0;padding:0;margin:20px 0}fieldset label{border:1px solid var(--line);padding:14px;margin:9px 0;border-radius:10px}input[type=radio]{display:inline;width:auto;min-height:0;margin-right:8px}main{outline:none}.crumb{font-size:14px}.help{border:2px solid var(--green);background:var(--tint)}.small{font-size:14px}#saved{font-weight:650;color:var(--green)}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{align-items:start;flex-wrap:wrap}.card{padding:18px}.wrap{padding:18px 14px}header{padding:16px}nav{gap:6px}nav button{padding:8px 10px}}@media(prefers-color-scheme:dark){:root{--bg:#15221f;--card:#20332d;--ink:#eff6f1;--muted:#b7cec2;--line:#486257;--green:#b0dfc8;--tint:#29483b}header{background:#254638}nav button[aria-current=page]{color:#15221f}}
</style>
<header><strong>BHW Reference Manual</strong><button id="language">Filipino</button></header>
<div class="wrap"><p class="notice" id="notice"></p><nav aria-label="Assessor preview navigation" id="nav"></nav><main id="content" tabindex="-1"></main><p id="saved" role="status"></p></div>
<script>
let lang='en',screen='qualifications',scenario='exam',tour=false,tourStep=0,rating='',note='',search='';
const t=(en,fil)=>lang==='en'?en:fil;
const content=document.querySelector('#content');
const button=(label,action,primary=false)=>`<button class="${primary?'primary':''}" data-action="${action}">${label}</button>`;
function go(next){screen=next;render();content.focus()}
function render(){document.documentElement.lang=lang;document.querySelector('#language').textContent=lang==='en'?'Filipino':'English';document.querySelector('#notice').textContent=t('Interactive design preview · Fictional people and records. Nothing is submitted to BHW Connect.','Preview ng disenyo · Kathang-isip ang mga tao at tala. Walang ipinapasa sa BHW Connect.');
 document.querySelector('#nav').innerHTML=[['qualifications',t('My qualifications','Aking kwalipikasyon')],['dashboard',t('BHWs in my area','Mga BHW sa aking lugar')]].map(([id,label])=>`<button data-screen="${id}" ${screen===id?'aria-current="page"':''}>${label}</button>`).join('')+button(t('How to facilitate','Gabay sa pagpapadaloy'),'tour');
 document.querySelector('#saved').textContent='';
 if(screen==='qualifications'){const done=scenario==='orientation'||scenario==='qualified';content.innerHTML=`<p class="muted">${t('Your assessor pathway','Iyong landas bilang assessor')}</p><h1>${t('Learn the chapter. Learn to assess.','Aralin ang kabanata. Matutong mag-assess.')}</h1><p>${t('Complete the full chapter and pass its exams before the scoring orientation. No practical assessment by another assessor is required.','Tapusin ang buong kabanata at ipasa ang mga pagsusulit bago ang oryentasyon sa pagmamarka. Hindi kailangan ng praktikal na pagtatasa ng ibang assessor.')}</p><label class="small">${t('Preview a candidate state','Pumili ng kalagayan para sa preview')}<select id="scenario"><option value="exam">${t('Chapter exam: 79%','Pagsusulit: 79%')}</option><option value="orientation">${t('Chapter exam passed: 80%','Naipasa ang pagsusulit: 80%')}</option><option value="qualified">${t('Orientation exercise passed','Naipasa ang pagsasanay sa pagmamarka')}</option></select></label><div class="grid"><section class="card"><span class="chip">${t('Chapter I','Kabanata I')}</span><h2>${t('BHWs and Their Barangay','Ang BHWs at ang Kanilang Barangay')}</h2><div class="step">✓ ${t('Full chapter: 42 of 42 lessons','Buong kabanata: 42 sa 42 aralin')}</div><div class="step">✓ ${t('Diagnostic pretest recorded','Naitala ang paunang pagsusulit')}</div><div class="step">${done?'✓':'↻'} ${t('Chapter exam','Pagsusulit sa kabanata')}: ${done?'80%':'79%'} · ${t('80% required','Kailangan ang 80%')}</div><div class="step">${scenario==='qualified'?'✓':'○'} ${t('Assessor orientation and scoring exercise','Oryentasyon at pagsasanay sa pagmamarka')}</div><p class="muted">${scenario==='qualified'?t('Qualified for Chapter I only.','Kwalipikado para sa Kabanata I lamang.'):done?t('Your next step is to learn how to score BHW competence.','Susunod: alamin kung paano mamarkahan ang kakayahan ng BHW.'):t('Review the chapter, then retake the exam. Orientation unlocks at 80%.','Balikan ang kabanata at ulitin ang pagsusulit. Magbubukas ang oryentasyon sa 80%.')}</p>${button(scenario==='qualified'?t('Open my area','Buksan ang aking lugar'):done?t('Preview orientation','Tingnan ang oryentasyon'):t('Preview a passing retake','Tingnan ang naipasang pag-ulit'),scenario==='qualified'?'dashboard':done?'orientation':'retake',true)}</section><aside class="card"><span class="chip">${t('Chapter II','Kabanata II')}</span><h2>${t('The BHW as First Responder','Ang BHW bilang First Responder')}</h2><p>${t('55 lessons in the source inventory. Assessor qualification will open when its exam and orientation are ready.','55 aralin sa imbentaryo. Magbubukas ang kwalipikasyon kapag handa na ang pagsusulit at oryentasyon.')}</p><span class="muted">${t('Qualification not yet available','Hindi pa available ang kwalipikasyon')}</span></aside></div>`;document.querySelector('#scenario').value=scenario;}
 if(screen==='orientation'){content.innerHTML=`<p class="crumb">${t('Chapter I → Assessor orientation','Kabanata I → Oryentasyon ng assessor')}</p><h1>${t('Score what you observe','Markahan ang iyong naobserbahan')}</h1><section class="card"><h2>${t('Sample case: the three BHW roles','Halimbawa: ang tatlong tungkulin ng BHW')}</h2><p>${t('The BHW names all three roles correctly and describes each distinctly in their own words.','Tamang nasabi ng BHW ang tatlong tungkulin at naipaliwanag ang bawat isa sa sariling salita.')}</p><p>${t('The existing Chapter I rubric calls this Kaya na. Compare it with a case where the third role needs prompting: Kailangan pa ng practice.','Kaya na ang katumbas nito sa rubrik ng Kabanata I. Ihambing sa kasong kailangan pang gabayan sa ikatlong tungkulin: Kailangan pa ng practice.')}</p><p class="muted">${t('This preview shows a worked example. The complete orientation and scored exercise are planned in AF-04.','Halimbawa lamang ito. Ang buong oryentasyon at pagsusulit ay bubuuin sa AF-04.')}</p>${button(t('Preview completed qualification','Tingnan ang natapos na kwalipikasyon'),'qualified',true)}</section>`;}
 if(screen==='dashboard'){content.innerHTML=`<p class="muted">${t('Los Baños · Assigned catchment','Los Baños · Itinalagang saklaw')}</p><h1>${t('BHWs in my area','Mga BHW sa aking lugar')}</h1><p>${t('See learning progress and the next assessment action.','Tingnan ang pag-aaral at susunod na hakbang sa pagtatasa.')}</p><label>${t('Search fictional BHWs','Hanapin ang kathang-isip na BHW')}<input id="search" type="search" placeholder="Marites / Rosa"></label><div id="roster"></div>`;document.querySelector('#search').value=search;roster();}
 if(screen==='bhw'){content.innerHTML=`<p class="crumb">${t('BHWs in my area → Marites Santos','Mga BHW sa aking lugar → Marites Santos')}</p><h1>Marites Santos</h1><p class="muted">${t('Fictional BHW · Chapter I · Solo learner','Kathang-isip na BHW · Kabanata I · Sariling pag-aaral')}</p><section class="card"><h2>${t('Chapter learning','Pag-aaral ng kabanata')}</h2><p>6 / 42 ${t('lessons complete','aralin ang natapos')}</p><progress value="6" max="42" aria-label="${t('Chapter I lesson completion','Natapos na aralin sa Kabanata I')}"></progress><p>${t('The rest of the chapter is still in progress. Related components can already be assessed.','Nagpapatuloy pa ang pag-aaral ng kabanata. Maaari nang tasahin ang natapos na kaugnay na bahagi.')}</p></section><section class="card row"><div><span class="chip">${t('Ready to assess','Handa nang tasahin')}</span><h2>1.1 · ${t('The Roles of a BHW','Mga Tungkulin ng BHW')}</h2><p>${t('6/6 related lessons complete; no separate subchapter exam currently authored.','Natapos ang 6/6 kaugnay na aralin; wala pang hiwalay na pagsusulit sa subchapter.')}</p></div>${scenario==='qualified'?button(t('Open assessment','Buksan ang pagtatasa'),'assess',true):button(t('Complete my qualification','Tapusin ang aking kwalipikasyon'),'qualifications')}</section><section class="card"><span class="chip">${t('Waiting for learning','Hinihintay ang pag-aaral')}</span><h2>1.2 · UHC</h2><p>${t('Complete its four lessons before this component unlocks.','Tapusin ang apat na aralin bago magbukas ang bahaging ito.')}</p></section>`;}
 if(screen==='assess'){content.innerHTML=`<p class="crumb">Marites Santos · 1.1</p><h1>${t('Record observed competence','Itala ang naobserbahang kakayahan')}</h1><section class="card"><h2>${t('Names and describes the three BHW roles','Nasasabi at nailalarawan ang tatlong tungkulin ng BHW')}</h2><p>${t('Use the observable behavior and its rating anchors.','Gamitin ang naobserbahang kilos at gabay sa pagmamarka.')}</p><fieldset><legend>${t('Choose a rating','Pumili ng antas')}</legend>${[['kaya_na','Kaya na',t('Names all three correctly, with distinct descriptions in their own words.','Tama ang tatlo at may sariling magkakaibang paglalarawan.')],['practice','Kailangan pa ng practice',t('Describes two clearly; the third needs prompting.','Malinaw ang dalawa; kailangan ng gabay sa pangatlo.')],['not_yet','Hindi pa',t('Connects only one role to their work.','Isang tungkulin lamang ang naiuugnay sa gawain.')]].map(([id,label,help])=>`<label><input type="radio" name="rating" value="${id}" ${rating===id?'checked':''}><strong>${label}</strong><br><span class="small">${help}</span></label>`).join('')}</fieldset><label>${t('Evidence and next practice','Ebidensiya at susunod na pagsasanay')}<textarea id="note" rows="4"></textarea></label><p class="small muted">${t('Describe what you saw. Use fictional examples only in this preview.','Ilarawan ang iyong nakita. Kathang-isip na halimbawa lamang ang gamitin dito.')}</p><button class="primary" data-action="review" id="review" ${!rating||!note.trim()?'disabled':''}>${t('Review observation','Suriin ang obserbasyon')}</button></section>`;document.querySelector('#note').value=note;}
 if(screen==='review'){content.innerHTML=`<p class="crumb">Marites Santos · 1.1</p><h1>${t('Review before recording','Suriin bago itala')}</h1><section class="card"><span class="chip">${rating==='kaya_na'?'Kaya na':rating==='practice'?'Kailangan pa ng practice':'Hindi pa'}</span><h2>${t('Evidence and next practice','Ebidensiya at susunod na pagsasanay')}</h2><p id="review-note"></p><p class="muted">${t('One observation does not complete the chapter. Final certification will review every required component.','Hindi sapat ang isang obserbasyon para matapos ang kabanata. Susuriin ang lahat ng kailangang bahagi bago ang sertipikasyon.')}</p>${button(t('Edit','Baguhin'),'assess')} ${button(t('Save demo observation','I-save ang halimbawang obserbasyon'),'save',true)}</section>`;document.querySelector('#review-note').textContent=note;}
 if(tour){const steps=[t('Find a BHW in your assigned area.','Hanapin ang BHW sa iyong saklaw.'),t('Open the chapter and read each component’s readiness reason.','Buksan ang kabanata at basahin kung handa na ang bawat bahagi.'),t('Record evidence and choose the matching rating.','Itala ang ebidensiya at piliin ang katumbas na antas.'),t('Review, give feedback and plan follow-up.','Suriin, magbigay ng puna at magplano ng follow-up.')];content.insertAdjacentHTML('afterbegin',`<section class="card help" aria-label="Facilitator guide"><h2>${t('How to facilitate','Gabay sa pagpapadaloy')} · ${tourStep+1}/4</h2><p>${steps[tourStep]}</p>${tourStep?button(t('Back','Bumalik'),'tour-back'):''} ${button(tourStep===3?t('Done','Tapos'):t('Next','Susunod'),'tour-next',true)} ${button(t('Skip','Laktawan'),'tour-close')}</section>`);}}
function roster(){document.querySelector('#roster').innerHTML=[['Marites Santos',t('6/42 lessons · 1 component ready','6/42 aralin · 1 bahagi ang handa')],['Rosa Dela Cruz',t('0/42 lessons · Pretest next','0/42 aralin · Paunang pagsusulit ang susunod')]].filter(([name])=>name.toLowerCase().includes(search.toLowerCase())).map(([name,state])=>`<section class="card row"><div><h2>${name}</h2><p>${state}</p></div>${name.startsWith('Marites')?button(t('View progress','Tingnan ang progreso'),'bhw',true):`<span class="muted">${t('Waiting for learning','Hinihintay ang pag-aaral')}</span>`}</section>`).join('')||`<p>${t('No matching BHWs.','Walang tumugmang BHW.')}</p>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='language'){lang=lang==='en'?'fil':'en';render();return}if(b.dataset.screen){go(b.dataset.screen);return}const a=b.dataset.action;if(['qualifications','dashboard','bhw','assess','review','orientation'].includes(a))go(a);if(a==='retake'){scenario='orientation';render()}if(a==='qualified'){scenario='qualified';go('qualifications')}if(a==='save'){go('bhw');document.querySelector('#saved').textContent=t('Demo observation recorded for this preview only.','Naitala ang halimbawa para lamang sa preview na ito.')}if(a==='tour'){tour=true;tourStep=0;render()}if(a==='tour-close'){tour=false;render()}if(a==='tour-back'){tourStep--;render()}if(a==='tour-next'){if(tourStep===3)tour=false;else tourStep++;render()}});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){scenario=e.target.value;render()}if(e.target.name==='rating'){rating=e.target.value;document.querySelector('#review').disabled=!rating||!note.trim()}});
document.addEventListener('input',e=>{if(e.target.id==='note'){note=e.target.value;document.querySelector('#review').disabled=!rating||!note.trim()}if(e.target.id==='search'){search=e.target.value;roster()}});render();
</script>
</html>
