<!--
  BHW Connect Phase 2 — Chat Guide & Training visual mockup
  Sample scenario: Timed & Targeted Care for Families (ttCF), Eastern Visayas.

  Self-contained, no external requests (CSP-safe for publishing as an Artifact).
  Body-only document: when published, a <!doctype>/<head>/<body> skeleton is
  added automatically. Opens directly in any browser too.

  NOTE ON CONTENT: ttCF health specifics (visit schedule, Q&A, quiz, checklist)
  are realistic *sample* content for demonstration — not sourced from an
  authoritative DOH / World Vision protocol. Correct exact figures before any
  external showing.
-->
<style>
  /* ---------- App design tokens (mirrors src/styles/tokens.css) ---------- */
  :root {
    --canvas: #f6f2ed;
    --ink: #2b2420;
    --primary: #b84e12;          /* Marigold, button-safe */
    --primary-display: #e8641c;  /* Marigold, display only */
    --secondary: #0c7c7e;        /* Bayanihan Teal */
    --celebration: #ffc857;      /* Sampaguita Yellow */
    --celebration-ink: #2b2420;
    --success: #1f7a45;
    --warning: #8f5a08;
    --danger: #c53a3a;
    --info: #2c6fa6;

    /* opacity-mix helpers used across the app UI */
    --ink-70: color-mix(in srgb, var(--ink) 70%, transparent);
    --ink-20: color-mix(in srgb, var(--ink) 20%, transparent);
    --ink-15: color-mix(in srgb, var(--ink) 15%, transparent);
    --ink-10: color-mix(in srgb, var(--ink) 10%, transparent);
    --ink-05: color-mix(in srgb, var(--ink) 5%, transparent);
    --secondary-30: color-mix(in srgb, var(--secondary) 30%, transparent);
    --secondary-10: color-mix(in srgb, var(--secondary) 10%, transparent);
  }
  /* App dark mode — driven by the in-demo light/dark toggle */
  :root[data-apptheme="dark"] {
    --canvas: #221b16;
    --ink: #f5ede4;
  }

  /* ---------- Presentation stage (deliberately its own world) ---------- */
  :root {
    --stage-bg: #07302f;         /* deep Bayanihan teal */
    --stage-bg-2: #0a3a3a;
    --stage-fg: #eaf5f4;
    --stage-muted: #9ec3c1;
    --stage-line: color-mix(in srgb, #eaf5f4 16%, transparent);
    --stage-accent: #e8641c;     /* marigold display */
    --stage-gold: #ffc857;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --radius-frame: 22px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    color: var(--stage-fg);
    background:
      radial-gradient(1200px 600px at 82% -10%, rgba(232,100,28,0.18), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(255,200,87,0.10), transparent 55%),
      linear-gradient(160deg, var(--stage-bg), var(--stage-bg-2));
    background-attachment: fixed;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  :focus-visible { outline: 3px solid var(--stage-gold); outline-offset: 2px; border-radius: 4px; }

  /* ---------- Top control bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px;
    background: color-mix(in srgb, var(--stage-bg) 82%, black);
    border-bottom: 1px solid var(--stage-line);
    backdrop-filter: blur(6px);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  .brand b { color: #fff; font-size: 15px; letter-spacing: 0.2px; font-weight: 700; }
  .brand span { color: var(--stage-muted); font-size: 12px; letter-spacing: 0.4px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--stage-accent); display:inline-block; margin-right:2px; }

  .ctl { display: flex; align-items: center; gap: 8px; }
  .ctl > .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--stage-muted); }
  .seg { display: inline-flex; overflow: hidden; border-radius: 999px; border: 1px solid var(--stage-line); }
  .seg button {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 13px;
    padding: 6px 14px; background: transparent; color: var(--stage-fg); transition: background .15s, color .15s;
  }
  .seg button[aria-pressed="true"] { background: var(--stage-accent); color: #fff; }
  .seg button:not([aria-pressed="true"]):hover { background: rgba(255,255,255,0.08); }

  .legend { display: flex; align-items: center; gap: 14px; font-size: 11px; color: var(--stage-muted); }
  .legend i { font-style: normal; display: inline-flex; align-items: center; gap: 6px; }
  .tag { font-size: 10px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; }
  .tag.live { background: color-mix(in srgb, var(--success) 26%, transparent); color: #bff0d0; border: 1px solid color-mix(in srgb, var(--success) 50%, transparent); }
  .tag.road { background: color-mix(in srgb, var(--stage-gold) 22%, transparent); color: var(--stage-gold); border: 1px solid color-mix(in srgb, var(--stage-gold) 45%, transparent); }

  /* ---------- Scene layout ---------- */
  main { max-width: 1180px; margin: 0 auto; padding: 26px 20px 40px; }
  .scene-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .scene-head .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 1.6px; color: var(--stage-accent); font-weight: 700; }
  .scene-head h2 { margin: 4px 0 2px; font-size: clamp(20px, 2.4vw, 28px); color: #fff; text-wrap: balance; line-height: 1.15; }
  .scene-head p { margin: 0; color: var(--stage-muted); max-width: 62ch; line-height: 1.5; }
  .stage { display: flex; gap: 26px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }

  /* device frames */
  .phone {
    width: 340px; max-width: 92vw; flex: 0 0 auto;
    background: #0c0c0d; border-radius: 40px; padding: 12px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.06) inset;
  }
  .phone .notch { height: 22px; display: flex; justify-content: center; align-items: center; }
  .phone .notch::before { content: ""; width: 120px; height: 6px; border-radius: 999px; background: #2a2a2c; }
  .phone .glass {
    background: var(--canvas); color: var(--ink);
    border-radius: 30px; overflow: hidden; height: 660px; display: flex; flex-direction: column;
  }
  .laptop { width: 760px; max-width: 96vw; flex: 0 0 auto; }
  .laptop .lid {
    background: #0c0c0d; border-radius: 16px 16px 0 0; padding: 10px 10px 0;
    box-shadow: 0 30px 60px -24px rgba(0,0,0,0.6);
  }
  .laptop .glass {
    background: var(--canvas); color: var(--ink); border-radius: 8px 8px 0 0;
    overflow: hidden; height: 560px; display: flex; flex-direction: column;
  }
  .laptop .base { height: 14px; background: linear-gradient(#161616,#0c0c0d); border-radius: 0 0 14px 14px;
    box-shadow: 0 12px 24px -12px rgba(0,0,0,0.7); }
  .laptop .base::after { content:""; display:block; width:90px; height:5px; margin: 3px auto 0; border-radius:0 0 8px 8px; background:#2a2a2c; }

  /* ---------- Generic in-app UI (mirrors the shipped components) ---------- */
  .app-header { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px 16px; border-bottom: 1px solid var(--ink-10); background: var(--canvas); flex: 0 0 auto; }
  .app-header .wordmark { font-weight: 700; color: var(--primary); font-size: 15px; }
  .app-header .mini-toggle { font-size: 11px; color: var(--ink-70); display: flex; gap: 6px; align-items: center; }
  .app-header .pill { border: 1px solid var(--ink-15); border-radius: 999px; overflow: hidden; display: inline-flex; }
  .app-header .pill span { padding: 3px 9px; font-size: 11px; font-weight: 600; color: var(--ink); }
  .app-header .pill span.on { background: var(--primary); color: var(--canvas); }

  .app-body { flex: 1 1 auto; overflow-y: auto; padding: 16px; }
  .app-body.chat { display: flex; flex-direction: column; }
  .app-title { font-size: 20px; font-weight: 650; letter-spacing: -0.2px; margin: 0 0 2px; color: var(--ink); }
  .app-sub { margin: 0 0 14px; color: var(--ink-70); font-size: 13px; line-height: 1.45; }

  .log { display: flex; flex-direction: column; gap: 12px; }
  .bubble { max-width: 85%; padding: 9px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; }
  .bubble.user { margin-left: auto; background: var(--primary); color: var(--canvas); border-bottom-right-radius: 4px; }
  .bubble.bot { background: var(--canvas); color: var(--ink); border: 1px solid var(--ink-10); border-bottom-left-radius: 4px; }
  .bubble.bot.pending { color: var(--ink-70); }
  .empty-state { border: 1px dashed var(--ink-20); border-radius: 10px; padding: 22px 16px; color: var(--ink-70); font-size: 13.5px; }
  .celebrate { background: var(--celebration); color: var(--celebration-ink); border-radius: 12px; padding: 9px 13px; font-size: 12.5px; font-weight: 600; }
  .chips { display: flex; flex-direction: column; gap: 8px; }
  .chips .chips-h { font-size: 12px; font-weight: 600; color: var(--ink-70); }
  .chip { text-align: left; min-height: 40px; border: 1px solid var(--ink-20); border-radius: 10px; padding: 8px 12px;
    font-size: 12.5px; color: var(--ink); background: transparent; cursor: pointer; }
  .chip:hover { background: var(--ink-05); }
  .did-you-mean { border: 1px solid var(--ink-10); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .did-you-mean .h { font-weight: 600; color: var(--ink); font-size: 13px; }
  .feedback { display: flex; align-items: center; gap: 8px; color: var(--ink-70); font-size: 12px; margin-top: 2px; }
  .feedback button { min-width: 40px; min-height: 40px; border: 1px solid var(--ink-20); border-radius: 10px; background: transparent; cursor: pointer; font-size: 16px; }
  .feedback button:hover { background: var(--ink-05); }
  .logged-note { font-size: 11.5px; color: var(--ink-70); display: flex; gap: 6px; align-items: flex-start; }
  .logged-note .k { color: var(--secondary); }

  .composer { border-top: 1px solid var(--ink-10); padding: 12px 16px; flex: 0 0 auto; background: var(--canvas); }
  .composer label { display: block; font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .composer .row { display: flex; gap: 8px; }
  .composer input { flex: 1; min-height: 44px; border: 1px solid var(--ink-20); border-radius: 10px; background: var(--canvas); color: var(--ink); padding: 8px 12px; font: inherit; font-size: 13.5px; }
  .composer input:focus { outline: none; border-color: var(--secondary); box-shadow: 0 0 0 3px var(--secondary-30); }
  .composer button.send { min-height: 44px; min-width: 84px; border: 0; border-radius: 10px; background: var(--primary); color: var(--canvas); font-weight: 600; cursor: pointer; }
  .typing-dots span { display:inline-block; animation: blink 1.2s infinite both; }
  .typing-dots span:nth-child(2){ animation-delay:.2s } .typing-dots span:nth-child(3){ animation-delay:.4s }
  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

  /* admin / desktop UI */
  .admin-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; border-bottom: 1px solid var(--ink-10); background: var(--canvas); }
  .admin-top .wordmark { font-weight: 700; color: var(--primary); font-size: 14px; }
  .admin-top .who { font-size: 12px; color: var(--ink-70); }
  .admin-tabs { display: flex; gap: 18px; padding: 10px 18px 0; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--ink-10); background: var(--canvas); }
  .admin-tabs a { color: var(--secondary); text-decoration: none; padding-bottom: 10px; border-bottom: 2px solid transparent; cursor: pointer; }
  .admin-tabs a.active { color: var(--ink); border-bottom-color: var(--primary); }
  .admin-main { padding: 18px; overflow-y: auto; }
  .range { display:inline-flex; gap:6px; align-items:center; font-size:12px; color: var(--ink-70); }
  .range .b { border: 1px solid var(--ink-20); border-radius: 8px; padding: 4px 10px; font-size: 12px; background: transparent; color: var(--ink); }
  .range .b.on { background: var(--ink-05); font-weight: 600; }

  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat { border: 1px solid var(--ink-10); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
  .stat .l { font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--ink-70); }
  .stat .v { font-size: 24px; font-weight: 700; letter-spacing: -0.4px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .stat .d { font-size: 11px; color: var(--success); font-weight: 600; }

  h3.sec { font-size: 15px; font-weight: 650; color: var(--ink); margin: 22px 0 10px; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--ink-10); border-radius: 10px; }
  table.grid { width: 100%; border-collapse: collapse; min-width: 640px; }
  table.grid th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--ink-70); font-weight: 700; padding: 9px 12px; background: var(--ink-05); }
  table.grid td { padding: 11px 12px; font-size: 12.5px; color: var(--ink); border-top: 1px solid var(--ink-10); vertical-align: middle; }
  table.grid tr.hot td { background: color-mix(in srgb, var(--celebration) 14%, transparent); }
  .num { font-variant-numeric: tabular-nums; }
  .badge { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.noans { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
  .badge.badans { background: color-mix(in srgb, var(--warning) 16%, transparent); color: var(--warning); }
  .btn { border: 0; border-radius: 8px; padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--primary); color: var(--canvas); }
  .btn.ghost { background: transparent; border: 1px solid var(--ink-20); color: var(--ink); }
  .btn.big { padding: 9px 16px; font-size: 13px; border-radius: 9px; }
  .btn:hover { filter: brightness(1.03); }

  .ol { border: 1px solid var(--ink-10); border-radius: 10px; overflow: hidden; }
  .ol li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; font-size: 12.5px; color: var(--ink); border-top: 1px solid var(--ink-10); }
  .ol li:first-child { border-top: 0; }
  .ol li .m { color: var(--ink-70); font-variant-numeric: tabular-nums; }
  .meter { display: inline-flex; align-items: center; gap: 8px; }
  .meter .track { width: 90px; height: 8px; border-radius: 999px; background: var(--ink-10); overflow: hidden; }
  .meter .fill { height: 8px; border-radius: 999px; background: var(--primary); }

  /* KB entry form */
  .kb-form { display: flex; flex-direction: column; gap: 14px; border: 1px solid var(--ink-10); border-radius: 10px; padding: 16px; }
  .prefill { background: var(--secondary-10); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--ink); }
  .fld { display: flex; flex-direction: column; gap: 5px; }
  .fld label { font-size: 12px; font-weight: 600; color: var(--ink); }
  .fld input, .fld textarea, .fld select { border: 1px solid var(--ink-20); border-radius: 8px; background: var(--canvas); color: var(--ink); padding: 8px 10px; font: inherit; font-size: 12.5px; }
  .fld textarea { resize: vertical; min-height: 60px; }
  .fld input:focus, .fld textarea:focus, .fld select:focus { outline: none; border-color: var(--secondary); box-shadow: 0 0 0 3px var(--secondary-30); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }

  /* training */
  .course-hero { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 14px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--secondary) 12%, var(--canvas)), var(--canvas)); border: 1px solid var(--ink-10); }
  .ring { --p: 58; width: 68px; height: 68px; border-radius: 999px; flex: 0 0 auto;
    background: conic-gradient(var(--secondary) calc(var(--p)*1%), var(--ink-10) 0); display: grid; place-items: center; }
  .ring::before { content: ""; width: 52px; height: 52px; border-radius: 999px; background: var(--canvas); grid-area: 1/1; }
  .ring b { grid-area: 1/1; font-size: 13px; font-weight: 700; color: var(--ink); z-index: 1; font-variant-numeric: tabular-nums; }
  .course-hero .meta h4 { margin: 0 0 3px; font-size: 15px; color: var(--ink); }
  .course-hero .meta p { margin: 0; font-size: 12px; color: var(--ink-70); }
  .modules { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .mod { display: flex; align-items: center; gap: 11px; border: 1px solid var(--ink-10); border-radius: 11px; padding: 10px 12px; }
  .mod .n { width: 26px; height: 26px; flex: 0 0 auto; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .mod .n.done { background: var(--success); color: #fff; }
  .mod .n.now { background: var(--primary); color: #fff; }
  .mod .n.todo { background: var(--ink-10); color: var(--ink-70); }
  .mod .t { flex: 1; }
  .mod .t b { display: block; font-size: 12.5px; color: var(--ink); font-weight: 600; }
  .mod .t span { font-size: 11px; color: var(--ink-70); }
  .mod .fmt { font-size: 10.5px; color: var(--ink-70); display: flex; gap: 5px; align-items: center; white-space: nowrap; }

  .quiz { border: 1px solid var(--ink-10); border-radius: 12px; padding: 16px; }
  .quiz .q { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 12px; }
  .quiz .opt { display: flex; align-items: center; gap: 10px; border: 1px solid var(--ink-20); border-radius: 10px; padding: 11px 13px; margin-bottom: 8px; cursor: pointer; font-size: 13px; color: var(--ink); }
  .quiz .opt .k { width: 20px; height: 20px; border-radius: 999px; border: 2px solid var(--ink-20); flex: 0 0 auto; }
  .quiz .opt.correct { border-color: var(--success); background: color-mix(in srgb, var(--success) 10%, transparent); }
  .quiz .opt.correct .k { border-color: var(--success); background: var(--success); }
  .quiz .opt.wrong { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); }
  .quiz .verdict { margin-top: 10px; font-size: 13px; font-weight: 600; }
  .handoff { margin-top: 14px; border: 1px dashed var(--secondary); border-radius: 12px; padding: 14px; display: flex; gap: 12px; align-items: center; background: var(--secondary-10); }
  .handoff .ic { font-size: 22px; }
  .handoff .t b { font-size: 13px; color: var(--ink); } .handoff .t p { margin: 2px 0 0; font-size: 12px; color: var(--ink-70); }

  /* assessor */
  .check { display: flex; flex-direction: column; gap: 8px; }
  .check .item { display: flex; align-items: center; gap: 11px; border: 1px solid var(--ink-10); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; color: var(--ink); }
  .check .item .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--success); flex: 0 0 auto; display: grid; place-items: center; color: #fff; background: var(--success); font-size: 12px; }
  .check .item.pending .box { border-color: var(--ink-20); background: transparent; }

  /* certificate */
  .cert-wrap { display: grid; place-items: center; padding: 8px; }
  .cert {
    width: 100%; max-width: 560px; border-radius: 16px; overflow: hidden; position: relative;
    background: var(--canvas); border: 1px solid var(--ink-10);
    box-shadow: 0 20px 50px -24px rgba(0,0,0,0.5);
  }
  .cert .band { height: 8px; background: linear-gradient(90deg, var(--primary-display), var(--celebration), var(--secondary)); }
  .cert .inner { padding: 22px 26px; text-align: center; }
  .cert .seal { width: 60px; height: 60px; margin: 0 auto 8px; border-radius: 999px; background: var(--celebration); color: var(--celebration-ink); display: grid; place-items: center; font-size: 26px; box-shadow: 0 0 0 6px color-mix(in srgb, var(--celebration) 30%, transparent); }
  .cert .k { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-70); font-weight: 700; }
  .cert h3 { margin: 6px 0 2px; font-size: 20px; color: var(--ink); }
  .cert .name { font-size: 26px; font-weight: 750; color: var(--primary-display); margin: 12px 0 4px; letter-spacing: -0.3px; }
  .cert .desc { font-size: 12.5px; color: var(--ink-70); max-width: 40ch; margin: 0 auto; line-height: 1.5; }
  .cert .foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 18px; text-align: left; }
  .cert .foot .sig { font-size: 11px; color: var(--ink-70); }
  .cert .foot .sig b { display: block; color: var(--ink); font-size: 12.5px; }
  .qr { width: 70px; height: 70px; border-radius: 8px; background: #fff; padding: 5px; }
  .qr svg { display: block; }
  .cert .verify { font-size: 10.5px; color: var(--secondary); text-align: right; }

  /* title + recap scenes */
  .hero { text-align: center; padding: 30px 12px 6px; }
  .hero .kicker { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--stage-gold); border: 1px solid color-mix(in srgb, var(--stage-gold) 40%, transparent); border-radius: 999px; padding: 5px 14px; }
  .hero h1 { font-size: clamp(30px, 5vw, 52px); line-height: 1.05; margin: 18px auto 10px; color: #fff; max-width: 16ch; text-wrap: balance; letter-spacing: -0.5px; }
  .hero h1 em { font-style: normal; color: var(--stage-accent); }
  .hero p { max-width: 60ch; margin: 0 auto; color: var(--stage-muted); font-size: 16px; line-height: 1.6; }
  .facts { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 26px auto 8px; }
  .fact { border: 1px solid var(--stage-line); border-radius: 14px; padding: 16px 18px; min-width: 150px; background: rgba(255,255,255,0.03); }

  .loop { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 6px; }
  .loop .step { border: 1px solid var(--stage-line); border-radius: 14px; padding: 16px; background: rgba(255,255,255,0.03); position: relative; }
  .loop .step .n { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--stage-accent); }
  .loop .step b { display: block; color: #fff; font-size: 14px; margin: 6px 0 4px; }
  .loop .step p { color: var(--stage-muted); font-size: 12px; line-height: 1.5; margin: 0; }

  .loop .step:last-child::after { content: "↺"; right: 50%; bottom: -30px; top: auto; transform: translateX(50%); }

  /* footer nav */
  .footnav { position: sticky; bottom: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 20px; background: color-mix(in srgb, var(--stage-bg) 82%, black); border-top: 1px solid var(--stage-line); backdrop-filter: blur(6px); }
  .dots { display: flex; gap: 7px; flex-wrap: wrap; }

  // decorative QR-like pattern (not a functional code) — deterministic
  function qrSvg(){
    var n=21, cells="", seed=0x9e3779b9;
    function rnd(i){ var x=Math.sin(i*12.9898+seed)*43758.5453; return x-Math.floor(x); }
    // three finder squares in the corners, like a real QR
    function inFinder(x,y){
      var a=(x<7&&y<7), b=(x>=n-7&&y<7), c=(x<7&&y>=n-7);
      if(!(a||b||c)) return -1;
      var lx = a? x : b? x-(n-7) : x;
      var ly = (a||b)? y : y-(n-7);
      var ring = (lx===0||lx===6||ly===0||ly===6);
      var core = (lx>=2&&lx<=4&&ly>=2&&ly<=4);
      return (ring||core) ? 1 : 0;
    }
    for(var y=0;y<n;y++){ for(var x=0;x<n;x++){
      var f=inFinder(x,y);
      var on = f>=0 ? f : (rnd(y*n+x) > 0.5 ? 1 : 0);
      if(on) cells += '<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';
    }}
    return '<svg viewBox="0 0 21 21" width="60" height="60" shape-rendering="crispEdges" aria-hidden="true"><g fill="#0c0c0d">'+cells+'</g></svg>';
  }

  function burst(){
    if (prefersReduced()) return;
    var colors=["#e8641c","#ffc857","#0c7c7e","#1f7a45","#b84e12"];
    for(var i=0;i<90;i++){ parts.push({ x:innerWidth/2+(Math.random()-0.5)*220, y:innerHeight*0.32,
      vx:(Math.random()-0.5)*8, vy:Math.random()*-9-3, g:0.28+Math.random()*0.1,
      s:5+Math.random()*6, c:colors[(Math.random()*colors.length)|0], r:Math.random()*6, vr:(Math.random()-0.5)*0.4, life:0 }); }
    if(!raf) tick();
  }
  var raf=null;
  function tick(){
    cx.clearRect(0,0,cv.width,cv.height);
    for(var i=parts.length-1;i>=0;i--){ var p=parts[i]; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life++;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); cx.restore();
      if(p.y>cv.height+20||p.life>200) parts.splice(i,1); }
    if(parts.length){ raf=requestAnimationFrame(tick); } else { raf=null; cx.clearRect(0,0,cv.width,cv.height); }
  }

  // -------------------------------------------------------------- init
  document.documentElement.setAttribute("data-apptheme","light");
  applyChrome();
  render();
})();
</script>
