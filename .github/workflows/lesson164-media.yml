name: Lesson 1.6.4 draft media generation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lesson164-media.yml'
      - 'docs/lesson-164-authored-screens.json'
      - 'scripts/lesson-164-media-build.mjs'
      - 'scripts/remotion-communication-record-narrate.mjs'
      - 'scripts/lib/communication-record-speech.mjs'
permissions:
  contents: read
concurrency:
  group: lesson164-media-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  draft:
    if: github.head_ref == 'codex/lesson-164-enhancement-handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: remotion
      - run: npx remotion browser ensure
        working-directory: remotion
      - name: Bounded read-only published snapshot
        env:
          KB_LOADER_USERNAME: ${{ vars.KB_LOADER_USERNAME || 'training.loader' }}
          KB_LOADER_PASSWORD: ${{ secrets.KB_LOADER_PASSWORD }}
          KB_LOADER_ANON_KEY: ${{ secrets.PILOT_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/lesson-164-published-snapshot.mjs
      - name: Generate only target draft media and preserve old media
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON164_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-164-record-fetch.mjs'
        run: node scripts/lesson-164-media-build.mjs
      - name: Full review of actual Read MP3 and shipped AAC
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON164_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-164-record-fetch.mjs'
        run: node scripts/lesson-164-audio-review.mjs
      - name: Decode and review fifty-six focused excerpts
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON164_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-164-record-fetch.mjs'
        run: node scripts/lesson-164-audio-focus.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson164-generated-evidence
          path: |
            lesson-164-published-snapshot.json
            content/training/day1-basic-competencies/narration.json
            content/training/day1-basic-competencies/modules/06-komunikasyon/lessons/communication-record/
            public/training/audio/06-komunikasyon/communication-record/
            public/training/bhw-1-6/communication-record-*
            remotion/public/communication-record/narration-*
            remotion/public/communication-record/shipped-aac-*
            docs/lesson-164-media-generation.json
            docs/lesson-164-audio-*.json
            .preview/lesson164-raw/
            .preview/lesson164-excerpts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
