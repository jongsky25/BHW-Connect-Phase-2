name: Lesson 1.9.3 draft Read narration and reviews
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lesson193-media.yml'
      - 'scripts/lesson-193-media-build.mjs'
      - 'scripts/lesson-193-audio-*.mjs'
      - 'content/training/day1-basic-competencies/modules/09-sustainable-practices/lessons/resources-monitor/**'
permissions:
  contents: read
concurrency:
  group: lesson193-media-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  draft-read:
    if: github.head_ref == 'codex/lesson-193-charlaine-handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: remotion
      - name: Generate only target Read narration; keep prior bytes/history
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON193_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-193-record-fetch.mjs'
        run: node scripts/lesson-193-media-build.mjs
      - name: Review actual full recordings
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON193_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-193-record-fetch.mjs'
        run: node scripts/lesson-193-audio-review.mjs
      - name: Decode and review four focused excerpts per available recording
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON193_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-193-record-fetch.mjs'
        run: node scripts/lesson-193-audio-focus.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson193-read-evidence
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
          path: |
            content/training/day1-basic-competencies/narration.json
            public/training/audio/09-sustainable-practices/resources-monitor/
            docs/lesson-193-media-generation.json
            docs/lesson-193-audio-*.json
            .preview/lesson193-raw/
            .preview/lesson193-excerpts/
            .preview/lesson193-decoded/
