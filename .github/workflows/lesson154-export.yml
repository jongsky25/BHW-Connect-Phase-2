name: Lesson 1.5.4 read-only evidence transport
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/lesson154-export.yml']
permissions:
  contents: read
  actions: read
jobs:
  plan:
    if: github.head_ref == 'codex/lesson-154-malou-proposal'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN: '37456063929'
          KIND: 'media'
          TARGET_BRANCH: ${{ github.head_ref }}
        shell: python
        run: |
          import urllib.request,os,json,math
          source=os.environ['SOURCE_RUN'];assert source.isdecimal()
          runurl='https://api.github.com/repos/jongsky25/BHW-Connect-Phase-2/actions/runs/'+source
          with urllib.request.urlopen(urllib.request.Request(runurl,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN']})) as response: run=json.load(response)
          assert run['head_branch']=='codex/lesson-154-malou-proposal'
          base=runurl+'/artifacts'
          req=urllib.request.Request(base,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN']})
          with urllib.request.urlopen(req) as r: data=json.load(r)
          prefixes={'render':'remotion-renders-','dry':'training-load-','media':('lesson154-draft-evidence')}
          artifacts=[a for a in data['artifacts'] if a['name'].startswith(prefixes[os.environ['KIND']]) and not a['expired']]
          assert len(artifacts)==(4 if os.environ['KIND']=='render' else 1)
          jobs=[]
          for a in artifacts:
            assert a['size_in_bytes']<=512*1024*1024
            for chunk in range(math.ceil(a['size_in_bytes']/(8*1024*1024))):jobs.append({'artifact_id':a['id'],'chunk':chunk})
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps({'include':jobs})+'\n')
  export:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Verify original ZIP and export one bounded chunk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
          CHUNK: ${{ matrix.chunk }}
        shell: python
        run: |
          import urllib.request,urllib.error,os,json,hashlib,base64,zipfile,io
          base='https://api.github.com/repos/jongsky25/BHW-Connect-Phase-2/actions/artifacts/'+os.environ['ARTIFACT_ID']
          headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN']}
          with urllib.request.urlopen(urllib.request.Request(base,headers=headers)) as r:meta=json.load(r)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args):return None
          try:
            urllib.request.build_opener(NoRedirect).open(urllib.request.Request(base+'/zip',headers=headers))
            raise RuntimeError('Expected artifact redirect')
          except urllib.error.HTTPError as e:
            if e.code!=302:raise
            location=e.headers['Location']
          # The signed storage request carries no GitHub authorization header.
          with urllib.request.urlopen(location) as r:data=r.read()
          digest=hashlib.sha256(data).hexdigest();assert meta['digest']=='sha256:'+digest
          with zipfile.ZipFile(io.BytesIO(data)) as z:assert z.testzip() is None
          index=int(os.environ['CHUNK']);chunk=data[index*8*1024*1024:(index+1)*8*1024*1024];assert chunk
          print('LESSON154_ZIP_CHUNK_BEGIN '+json.dumps({'artifact_id':meta['id'],'index':index,'zip_bytes':len(data),'zip_sha256':digest,'chunk_bytes':len(chunk),'chunk_sha256':hashlib.sha256(chunk).hexdigest()},separators=(',',':')))
          encoded=base64.b64encode(chunk).decode()
          for offset in range(0,len(encoded),8192):print('LESSON154_ZIP_CHUNK_DATA '+encoded[offset:offset+8192])
          print('LESSON154_ZIP_CHUNK_END')
