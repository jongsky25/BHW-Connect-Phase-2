name: E2E test course purge

# Courses cleanup: every E2E spec that provisions a course via
# rpc_course_create (elearning.spec.ts's first test, slide-mode.spec.ts,
# slide-mode-a11y.spec.ts, lesson-narration.spec.ts's narrated/scene
# fixtures, training-sessions.spec.ts) publishes it and never deletes it
# — the BHW/assessor activity it generates trips rpc_course_delete's own
# "course has learner progress" / "recorded test attempts" guard, so a
# manual delete isn't an option either. rpc_e2e_purge_test_courses
# (supabase/migrations/20261002000400_e2e_test_course_purge.sql) is the
# courses counterpart of e2e-test-users-purge.yml's
# rpc_e2e_purge_test_users. Same dry-run-first shape: runs as a
# count-only dry run weekly so the counts stay visible in the Actions
# log; a human flips `dry_run` to `false` via "Run workflow" once
# they've reviewed a few dry runs and are ready to let it actually
# delete on schedule too.
#
# Signs in as admin.stable with the anon key, same as the user purge —
# rpc_e2e_purge_test_courses accepts an admin caller for exactly this
# reason. It only ever matches courses whose title carries an
# `e2e.<spec-tag>.<epoch-ms>.<random>` marker, older than 24h
# (`p_min_age_hours`, left at its default here so an in-flight E2E run
# is never touched).
on:
  schedule:
    - cron: "30 4 * * 1" # every Monday, 04:30 UTC (after the user purge)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Count only (true) or actually delete (false)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in as admin.stable and call rpc_e2e_purge_test_courses
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ADMIN_PASSWORD: ${{ secrets.E2E_STABLE_ADMIN_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY / E2E_STABLE_ADMIN_PASSWORD secrets are not set"
            exit 1
          fi

          login_payload=$(jq -n --arg pw "$ADMIN_PASSWORD" '{email: "admin.stable@bhw.local", password: $pw}')
          token=$(curl -sS --fail-with-body -X POST \
            "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d "$login_payload" | jq -r '.access_token // empty')

          if [ -z "$token" ]; then
            echo "::error::Failed to sign in as admin.stable"
            exit 1
          fi

          curl -sS --fail-with-body -X POST \
            "$SUPABASE_URL/rest/v1/rpc/rpc_e2e_purge_test_courses" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            -d "{\"p_dry_run\": $DRY_RUN}" | tee purge-result.json

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-course-purge-result-${{ github.run_id }}
          path: purge-result.json
          retention-days: 90
