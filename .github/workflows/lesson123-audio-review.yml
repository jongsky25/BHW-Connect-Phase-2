name: Lesson 1.2.3 draft audio review
on:
  push:
    branches: [codex/lesson-123-story-gemini]
    paths:
      - .github/workflows/lesson123-audio-review.yml
      - scripts/lesson-123-audio-review.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Review only final target media with existing Gemini secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/lesson-123-audio-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson123-automated-listening
          path: docs/lesson-123-automated-listening.json
          retention-days: 14
