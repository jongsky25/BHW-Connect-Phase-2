name: Lesson 1.2.1 draft translation audio

on:
  push:
    branches: [codex/lesson-121-translations]
    paths:
      - .github/workflows/lesson121-translation-audio.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lesson121-translation-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-audio:
    if: github.ref == 'refs/heads/codex/lesson-121-translations'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: [ceb, hil]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate lesson 1.2.1 with corrected exact-word pronunciation directions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/lesson-translation-narrate.mjs --lesson 1.2.1 --language ${{ matrix.language }} --apply
      - name: Save narration and completed partial tracks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson121-translation-audio-${{ matrix.language }}
          retention-days: 14
          path: |
            content/training/day1-basic-competencies/modules/02-uhc-act/lessons/uhc-coverage/media.${{ matrix.language }}.json
            content/training/day1-basic-competencies/modules/02-uhc-act/lessons/uhc-coverage/pilot.${{ matrix.language }}.json
            public/training/audio/02-uhc-act/uhc-coverage/*.${{ matrix.language }}.*.mp3
            remotion/public/uhc-purpose/narration-${{ matrix.language }}.*
            .preview/*-tts-cache/
          include-hidden-files: true
          if-no-files-found: error
