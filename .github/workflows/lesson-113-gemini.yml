name: Render lesson 1.1.3 Gemini narration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lesson-113-gemini-render
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render the approved lesson with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is missing from repository secrets"
            exit 1
          fi
          npm run training:narrate -- --modules 01-tungkulin-ng-bhw --lessons bhw-community-organizer --provider gemini --apply
          npm run training:narrate -- --modules 01-tungkulin-ng-bhw --lessons bhw-community-organizer --provider gemini
      - name: Save rendered audio and manifest for review
        uses: actions/upload-artifact@v4
        with:
          name: lesson-113-gemini-narration
          path: |
            content/training/day1-basic-competencies/narration.json
            public/training/audio/01-tungkulin-ng-bhw/bhw-community-organizer/*.mp3
          if-no-files-found: error
          retention-days: 7
