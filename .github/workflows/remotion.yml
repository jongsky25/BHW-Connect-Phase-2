name: Remotion clips

# INC-28 tier 2 (docs/training-modules-plan.md). Proves every committed
# composition in remotion/ still lints, typechecks and renders to the lesson
# format (480p H.264 + last-frame poster) within the size budget, and keeps
# the render as a downloadable artifact for review. It does NOT replace the
# committed files under public/training/: renders are not byte-reproducible
# across machines, so a lesson's hashed clip is re-rendered locally with
# `npm run remotion:render -- <id> <name> --public <dir>` and committed with
# its new lesson.json hashes, like every other training asset.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "remotion/**"
      - "scripts/remotion-render.mjs"
      - "scripts/lesson-161-*.mjs"
      - "scripts/lesson-162-*"
      - "docs/lesson-162-*"
      - "scripts/lesson-163-*.mjs"
      - ".github/workflows/lesson163-media.yml"
      - ".github/workflows/remotion.yml"
  push:
    branches: [main]
    paths:
      - "remotion/**"
      - "scripts/remotion-render.mjs"
      - "scripts/lesson-161-*.mjs"
      - "scripts/lesson-162-*"
      - "docs/lesson-162-*"
      - "scripts/lesson-163-*.mjs"
      - ".github/workflows/lesson163-media.yml"
      - ".github/workflows/remotion.yml"

concurrency:
  group: remotion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    # Split the complete library across eight runners. The 88-composition
    # regression reached nearly 30 minutes on four; retain every check and clip.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    # Preserve every clip, poster, size-budget check and downloadable artifact.
    # Eight shards leave room for rendering and uploading every composition.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Check this draft's exact head; other branches keep their standard checkout.
          ref: ${{ (github.head_ref == 'codex/lesson-151-malou-proposal' || github.head_ref == 'codex/lesson-152-malou-proposal' || github.head_ref == 'codex/lesson-154-malou-proposal' || github.head_ref == 'codex/lesson-156-malou-proposal' || github.head_ref == 'codex/lesson-161-enhancement-handoff' || github.head_ref == 'codex/lesson-162-enhancement-handoff' || github.head_ref == 'codex/lesson-163-enhancement-handoff' || github.head_ref == 'codex/lesson-164-enhancement-handoff' || github.head_ref == 'codex/lesson-165-enhancement-handoff' || github.head_ref == 'codex/lesson-171-carole-handoff' || github.head_ref == 'codex/lesson-172-carole-handoff' || github.head_ref == 'codex/lesson-174-carole-handoff' || github.head_ref == 'codex/lesson-181-apple-handoff' || github.head_ref == 'codex/lesson-182-apple-handoff' || github.head_ref == 'codex/lesson-183-apple-handoff' || github.head_ref == 'codex/lesson-192-charlaine-handoff') && github.event.pull_request.head.sha || github.sha }}

      - name: Wait for this draft's measured story timings
        id: scope
        run: |
          if { [ "${{ github.head_ref }}" = "codex/lesson-182-apple-handoff" ] && ! test -f docs/lesson-182-final-evidence-origins.json; } || { [ "${{ github.head_ref }}" = "codex/lesson-192-charlaine-handoff" ] && ! test -f docs/lesson-192-audio-review-complete.json; }; then
            echo "render=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.head_ref }}" = "codex/lesson-192-charlaine-handoff" ] && python3 scripts/lesson-192-registry-verify.py --cache-valid; then
            echo "render=false" >> "$GITHUB_OUTPUT"
          else
            echo "render=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.render == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install Remotion project
        if: steps.scope.outputs.render == 'true'
        working-directory: remotion
        run: npm ci

      - name: Lint and typecheck
        if: steps.scope.outputs.render == 'true'
        working-directory: remotion
        run: npm run lint

      - name: Install Remotion's headless browser
        if: steps.scope.outputs.render == 'true'
        working-directory: remotion
        run: npx remotion browser ensure

      - name: Render every composition
        if: steps.scope.outputs.render == 'true'
        env:
          RENDER_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # `--quiet` ends with the IDs space-separated on one line; split
          # that line and keep only ID-shaped words.
          ids=$(cd remotion && npx remotion compositions --quiet | tail -n 1 | tr -s ' \t' '\n' | grep -E '^[A-Za-z0-9-]+$')
          index=0
          for id in $ids; do
            if [ "$((index % 8))" -eq "$RENDER_SHARD" ]; then
              node scripts/remotion-render.mjs "$id" 2>&1 | tee -a render.log
            fi
            index=$((index + 1))
          done
          if grep -q "warn .* exceeds" render.log; then
            echo "::error::A clip exceeds the INC-28 size budget (see log above)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.render == 'true'
        with:
          name: remotion-renders-${{ matrix.shard }}
          path: remotion/out/
          retention-days: 14
