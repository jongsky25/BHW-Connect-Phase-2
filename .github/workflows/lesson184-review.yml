name: Lesson 1.8.4 frozen draft package
on:
  workflow_dispatch:
    inputs:
      media_run_id:
        description: Exact repository-secret generation run whose raw evidence is retained
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: github.ref_name == 'codex/lesson-184-apple-handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: remotion
      - run: npx remotion browser ensure
        working-directory: remotion
      - name: Select actual installed browser
        run: |
          node --input-type=module -e "import fs from 'node:fs';import {createRequire} from 'node:module';const r=createRequire(process.cwd()+'/remotion/package.json');const {ensureBrowser}=r('@remotion/renderer');const b=await ensureBrowser();fs.appendFileSync(process.env.GITHUB_ENV,'PLAYWRIGHT_EXECUTABLE_PATH='+b.path+'\n');"
      - uses: actions/download-artifact@v4
        with:
          name: lesson184-generated-evidence
          run-id: ${{ inputs.media_run_id }}
          github-token: ${{ github.token }}
          path: .preview/lesson184-import
      - uses: actions/download-artifact@v4
        with:
          name: lesson184-generated-evidence
          run-id: '37902026484'
          github-token: ${{ github.token }}
          path: .preview/lesson184-initial-import
      - uses: actions/download-artifact@v4
        with:
          name: lesson184-generated-evidence
          run-id: '37904386204'
          github-token: ${{ github.token }}
          path: .preview/lesson184-story-import
      - name: Retain exact raw reviews without replacing committed media
        run: |
          mkdir -p .preview/lesson184-raw .preview/lesson184-excerpts
          cp -a .preview/lesson184-initial-import/.preview/lesson184-raw/. .preview/lesson184-raw/
          cp -a .preview/lesson184-story-import/.preview/lesson184-raw/. .preview/lesson184-raw/
          cp .preview/lesson184-initial-import/lesson-184-published-snapshot.json .
          cp -a .preview/lesson184-import/.preview/lesson184-raw/. .preview/lesson184-raw/
          cp -a .preview/lesson184-import/.preview/lesson184-excerpts/. .preview/lesson184-excerpts/
      - name: Verify all retained media and protected predecessor bytes
        run: node scripts/lesson-184-preservation.mjs
      - name: Restore exact checked primary-source excerpts
        run: |
          python3 -m pip install PyMuPDF==1.26.6
          python3 scripts/lesson-184-source-evidence.py
      - name: Actual component review and browser matrix
        run: |
          node scripts/lesson-184-review-build.mjs
          node scripts/lesson-184-browser-verify.mjs
      - name: Print and verify bilingual A4 sheets
        run: |
          python3 -m pip install PyMuPDF==1.26.6
          node scripts/lesson-184-print-kit.mjs
          python3 scripts/lesson-184-print-verify.py
      - name: Verify safe ZIP members, CRC, hashes and exact inline bytes
        run: python3 scripts/lesson-184-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: lesson184-draft-review
          path: |
            .preview/lesson184-deliverables/lesson-1.8.4-apple-draft-review.zip
            .preview/lesson184-deliverables/lesson-184-package-integrity.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
