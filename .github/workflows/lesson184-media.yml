name: Lesson 1.8.4 draft media and review package
on:
  workflow_dispatch:
    inputs:
      package_only:
        description: Build the frozen review package without generating media
        type: boolean
        default: false
      media_run_id:
        description: Exact run holding final raw audio review evidence
        type: string
        default: '37906597742'
      review_only:
        description: Review exact committed media without generating replacement bytes
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lesson184-media.yml'
      - 'scripts/lesson-184-media-build.mjs'
      - 'scripts/lesson-184-audio-*.mjs'
      - 'scripts/remotion-safety-demonstrate-narrate.mjs'
      - 'remotion/src/safety-demonstrate/**'
      - 'content/training/day1-basic-competencies/modules/08-osh/lessons/safety-demonstrate/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: lesson184-media-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  draft:
    if: (github.head_ref == 'codex/lesson-184-apple-handoff' || github.ref_name == 'codex/lesson-184-apple-handoff') && inputs.package_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Skip generation after imported evidence is frozen
        id: scope
        run: |
          if test '${{ inputs.review_only }}' = 'true'; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
          elif test -f docs/lesson-184-evidence-origins.json; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.generate == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.scope.outputs.generate == 'true'
        run: npm ci
      - if: steps.scope.outputs.generate == 'true'
        run: npm ci
        working-directory: remotion
      - if: steps.scope.outputs.generate == 'true'
        run: npx remotion browser ensure
        working-directory: remotion
      - name: Bounded read-only published content snapshot
        if: steps.scope.outputs.generate == 'true'
        continue-on-error: true
        env:
          KB_LOADER_USERNAME: ${{ vars.KB_LOADER_USERNAME || 'training.loader' }}
          KB_LOADER_PASSWORD: ${{ secrets.KB_LOADER_PASSWORD }}
          KB_LOADER_ANON_KEY: ${{ secrets.PILOT_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/lesson-184-published-snapshot.mjs
      - name: Generate target narration with immutable historical media
        if: steps.scope.outputs.generate == 'true' && inputs.review_only != true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON184_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-184-record-fetch.mjs'
        run: node scripts/lesson-184-media-build.mjs
      - name: Full actual Read audio review
        if: always() && steps.scope.outputs.generate == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON184_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-184-record-fetch.mjs'
        run: node scripts/lesson-184-audio-review.mjs
      - name: Focused actual decoded audio review
        if: always() && steps.scope.outputs.generate == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON184_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-184-record-fetch.mjs'
        run: node scripts/lesson-184-audio-focus.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.generate == 'true'
        with:
          name: lesson184-generated-evidence
          path: |
            lesson-184-published-snapshot.json
            content/training/day1-basic-competencies/narration.json
            public/training/audio/08-osh/safety-demonstrate/
            content/training/day1-basic-competencies/modules/08-osh/lessons/safety-demonstrate/lesson.json
            public/training/bhw-1-8/safety-demonstrate-*
            remotion/public/safety-demonstrate/narration-*
            remotion/public/safety-demonstrate/shipped-aac-*
            docs/lesson-184-media-generation.json
            docs/lesson-184-audio-*.json
            .preview/lesson184-raw/
            .preview/lesson184-excerpts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  review-package:
    if: github.ref_name == 'codex/lesson-184-apple-handoff' && inputs.package_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: remotion
      - run: npx remotion browser ensure
        working-directory: remotion
      - name: Select actual installed browser
        run: |
          node --input-type=module -e "import fs from 'node:fs';import {createRequire} from 'node:module';const r=createRequire(process.cwd()+'/remotion/package.json');const {ensureBrowser}=r('@remotion/renderer');const b=await ensureBrowser();fs.appendFileSync(process.env.GITHUB_ENV,'PLAYWRIGHT_EXECUTABLE_PATH='+b.path+'\n');"
      - uses: actions/download-artifact@v4
        with:
          name: lesson184-generated-evidence
          run-id: ${{ inputs.media_run_id }}
          github-token: ${{ github.token }}
          path: .preview/lesson184-import
      - uses: actions/download-artifact@v4
        with:
          name: lesson184-generated-evidence
          run-id: '37902026484'
          github-token: ${{ github.token }}
          path: .preview/lesson184-initial-import
      - uses: actions/download-artifact@v4
        with:
          name: lesson184-generated-evidence
          run-id: '37904386204'
          github-token: ${{ github.token }}
          path: .preview/lesson184-story-import
      - name: Retain exact raw reviews without replacing committed media
        run: |
          mkdir -p .preview/lesson184-raw .preview/lesson184-excerpts
          cp -a .preview/lesson184-initial-import/.preview/lesson184-raw/. .preview/lesson184-raw/
          cp -a .preview/lesson184-story-import/.preview/lesson184-raw/. .preview/lesson184-raw/
          cp .preview/lesson184-initial-import/lesson-184-published-snapshot.json .
          cp -a .preview/lesson184-import/.preview/lesson184-raw/. .preview/lesson184-raw/
          cp -a .preview/lesson184-import/.preview/lesson184-excerpts/. .preview/lesson184-excerpts/
          cp .preview/lesson184-import/remotion/public/safety-demonstrate/shipped-aac-*.wav remotion/public/safety-demonstrate/
      - name: Verify all retained media and protected predecessor bytes
        run: node scripts/lesson-184-preservation.mjs
      - name: Restore exact checked primary-source excerpts
        run: |
          python3 -m pip install PyMuPDF==1.26.6
          python3 scripts/lesson-184-source-evidence.py
      - name: Actual component review and browser matrix
        run: |
          node scripts/lesson-184-review-build.mjs
          node scripts/lesson-184-browser-verify.mjs
      - name: Print and verify bilingual A4 sheets
        run: |
          python3 -m pip install PyMuPDF==1.26.6
          node scripts/lesson-184-print-kit.mjs
          python3 scripts/lesson-184-print-verify.py
      - name: Verify safe ZIP members, CRC, hashes and exact inline bytes
        run: python3 scripts/lesson-184-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: lesson184-draft-review
          path: |
            .preview/lesson184-deliverables/lesson-1.8.4-apple-draft-review.zip
            .preview/lesson184-deliverables/lesson-184-package-integrity.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
