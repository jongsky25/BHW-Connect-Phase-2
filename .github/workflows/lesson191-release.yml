name: Lesson 1.9.1 owner-authorized complete lesson release
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  statuses: read
  actions: read
concurrency:
  group: training-load-ltzicxyefizxoqhfuuzc
  cancel-in-progress: false
jobs:
  publish-approved-one:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch immutable historical review commits
        run: git fetch origin refs/pull/277/head refs/pull/276/head
      - run: npm ci
      - name: Verify exact approval, source and public media bytes
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import {createHash} from 'node:crypto';
          const a=JSON.parse(fs.readFileSync('docs/lesson-191-owner-approval.json','utf8'));
          const hash=b=>createHash('sha256').update(b).digest('hex');
          if(a.authorization!=='approved. merge and deploy to live')throw Error('Owner approval missing');
          for(const [p,h] of Object.entries(a.approved_source_sha256))if(hash(fs.readFileSync(p))!==h)throw Error('Approved source changed: '+p);
          for(const m of a.approved_media)if(hash(fs.readFileSync('public'+m.path))!==m.sha256)throw Error('Approved media changed: '+m.path);
          console.log('Exact approved source and '+a.approved_media.length+' selected public media files verified.');
          JS
      - name: Verify the authorized release is the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          node scripts/lesson-191-release-check.mjs
      - name: Wait for exact production deployment and isolated CI E2E
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JS'
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA;
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          for(let i=0;i<60;i++){
            const [statuses,runs]=await Promise.all([
              fetch(`https://api.github.com/repos/${repo}/commits/${sha}/status`,{headers}).then(r=>r.json()),
              fetch(`https://api.github.com/repos/${repo}/actions/workflows/ci.yml/runs?head_sha=${sha}&event=push&per_page=10`,{headers}).then(r=>r.json())]);
            const vercel=statuses.statuses?.find(s=>s.context==='Vercel');
            const ci=runs.workflow_runs?.find(r=>r.head_sha===sha);
            if(vercel?.state==='failure'||vercel?.state==='error')throw Error('Production deployment failed');
            if(ci?.status==='completed'){
              const jobs=await fetch(ci.jobs_url,{headers}).then(r=>r.json());
              const e2e=jobs.jobs?.find(j=>j.name==='e2e');
              if(e2e?.conclusion!=='success')throw Error('Disposable E2E failed');
              if(vercel?.state==='success'){console.log('Exact merged SHA deployed; isolated CI E2E passed. Full unit exception checked separately.');break;}
            }
            if(i===59)throw Error('Timed out waiting for exact production and CI E2E');
            await new Promise(r=>setTimeout(r,15000));
          }
          JS
      - name: Verify local release guards and static checks
        run: |
          npx vitest run scripts/tests/lesson-191.test.mjs scripts/tests/lesson-191-release.test.mjs scripts/tests/lesson-192.test.mjs scripts/tests/lesson-192-release.test.mjs scripts/tests/lesson-184.test.mjs scripts/tests/lesson-184-release.test.mjs scripts/tests/lesson-174.test.mjs scripts/tests/lesson-174-release.test.mjs scripts/tests/lesson-181.test.mjs scripts/tests/lesson-181-release.test.mjs scripts/tests/lesson-182.test.mjs scripts/tests/lesson-182-release.test.mjs scripts/tests/lesson-183.test.mjs scripts/tests/lesson-183-release.test.mjs scripts/tests/lesson-171.test.mjs scripts/tests/lesson-171-release.test.mjs scripts/tests/lesson-172.test.mjs scripts/tests/lesson-172-release.test.mjs scripts/tests/lesson-173.test.mjs
          npm run lint
          npm run typecheck
      - name: Verify production alias serves all approved selected bytes
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import {createHash} from 'node:crypto';
          const a=JSON.parse(fs.readFileSync('docs/lesson-191-owner-approval.json','utf8'));
          for(const m of a.approved_media){
            const response=await fetch('https://bhw-connect-phase-2.vercel.app'+m.path);
            if(!response.ok)throw Error('Production HTTP '+response.status+': '+m.path);
            const bytes=Buffer.from(await response.arrayBuffer());
            const digest=createHash('sha256').update(bytes).digest('hex');
            if(digest!==m.sha256)throw Error('Production byte mismatch: '+m.path);
            const type=response.headers.get('content-type')??'';
            const expected={mp3:'audio/',mp4:'video/',jpg:'image/',png:'image/',svg:'image/',vtt:'text/'}[m.path.split('.').at(-1)];
            if(!expected||!type.startsWith(expected))throw Error('Production media type mismatch: '+m.path+' '+type);
            console.log(m.path+' '+response.status+' '+type+' '+bytes.length+' '+digest);
          }
          JS
      - name: Snapshot sixteen bounded rows before publication
        env:
          KB_LOADER_USERNAME: ${{ vars.KB_LOADER_USERNAME || 'training.loader' }}
          KB_LOADER_PASSWORD: ${{ secrets.KB_LOADER_PASSWORD }}
          KB_LOADER_ANON_KEY: ${{ secrets.PILOT_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ALLOW_PILOT: '1'
        run: node scripts/lesson-191-release-snapshot.mjs before
      - name: Dry-run target-only loader
        env:
          KB_LOADER_USERNAME: ${{ vars.KB_LOADER_USERNAME || 'training.loader' }}
          KB_LOADER_PASSWORD: ${{ secrets.KB_LOADER_PASSWORD }}
          KB_LOADER_ANON_KEY: ${{ secrets.PILOT_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ALLOW_PILOT: '1'
        run: npm run training:load -- --mode lessons --project ltzicxyefizxoqhfuuzc --org-unit 'Department of Health' --modules 09-sustainable-practices --lesson-keys resources-audit --dry-run
      - name: Apply and publish the one approved revision
        env:
          KB_LOADER_USERNAME: ${{ vars.KB_LOADER_USERNAME || 'training.loader' }}
          KB_LOADER_PASSWORD: ${{ secrets.KB_LOADER_PASSWORD }}
          KB_LOADER_ANON_KEY: ${{ secrets.PILOT_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ALLOW_PILOT: '1'
        run: npm run training:load -- --mode lessons --project ltzicxyefizxoqhfuuzc --org-unit 'Department of Health' --modules 09-sustainable-practices --lesson-keys resources-audit --apply --publish
      - name: Verify one approved and fifteen unchanged published rows
        env:
          KB_LOADER_USERNAME: ${{ vars.KB_LOADER_USERNAME || 'training.loader' }}
          KB_LOADER_PASSWORD: ${{ secrets.KB_LOADER_PASSWORD }}
          KB_LOADER_ANON_KEY: ${{ secrets.PILOT_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ALLOW_PILOT: '1'
        run: |
          node scripts/lesson-191-release-snapshot.mjs after
          git diff --exit-code -- content/training/day1-basic-competencies/locks
      - name: Install browser for deliberate production preview
        run: npx playwright install --with-deps chromium
      - name: Verify authenticated production lesson preview
        env:
          KB_LOADER_USERNAME: ${{ vars.KB_LOADER_USERNAME || 'training.loader' }}
          KB_LOADER_PASSWORD: ${{ secrets.KB_LOADER_PASSWORD }}
          KB_LOADER_ANON_KEY: ${{ secrets.PILOT_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ALLOW_PILOT: '1'
          E2E_STABLE_ADMIN_USERNAME: ${{ vars.E2E_STABLE_ADMIN_USERNAME || 'admin.stable' }}
          E2E_STABLE_ADMIN_PASSWORD: ${{ secrets.E2E_STABLE_ADMIN_PASSWORD }}
        run: node scripts/lesson-191-live-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson191-live-release-${{ github.sha }}
          path: |
            lesson-191-before.json
            lesson-191-after.json
            lesson-191-live-smoke.json
            lesson-191-release-check.json
            lesson-191-release-unit-tests.json
          retention-days: 30
          if-no-files-found: ignore
