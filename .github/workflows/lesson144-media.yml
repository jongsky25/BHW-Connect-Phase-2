name: Lesson 1.4.4 draft Gemini media

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      review_only:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lesson144-draft-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-media:
    if: github.ref == 'refs/heads/codex/lesson-144-demi-proposal'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: remotion
      - run: npx remotion browser ensure
        working-directory: remotion
      - name: Generate lesson 1.4.4 media
        if: inputs.review_only != true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/lesson-144-media-build.mjs
      - name: Model-mediated audio review of actual completed tracks
        if: always() && inputs.review_only != true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/lesson-144-audio-review.mjs
      - name: Focused review of committed audio excerpts
        if: inputs.review_only == true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/lesson-144-audio-focus.mjs
      - name: Save review artifacts, including completed partial tracks on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson144-draft-media
          retention-days: 14
          path: |
            content/training/day1-basic-competencies/narration.json
            content/training/day1-basic-competencies/modules/04-ra7883/lessons/bhw-accreditation/lesson.json
            public/training/audio/04-ra7883/bhw-accreditation/
            public/training/bhw-1-4/bhw-accreditation-gemini-*
            remotion/public/bhw-accreditation/
            remotion/src/Root.tsx
            docs/lesson-144-media-generation.json
            docs/lesson-144-audio-review.json
            docs/lesson-144-audio-focus.json
          if-no-files-found: error
