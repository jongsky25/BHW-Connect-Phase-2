name: Lesson 1.5.2 draft evidence and media
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lesson152-media.yml'
      - 'scripts/lesson-152-*.mjs'
      - 'scripts/tests/lesson-152.test.mjs'
      - 'docs/lesson-152-audio*.json'
      - 'scripts/remotion-bhw-barangay-partners-narrate.mjs'
      - 'content/training/day1-basic-competencies/modules/05-bhw-at-barangay/lessons/bhw-barangay-partners/**'
      - 'remotion/src/bhw-barangay-partners/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: lesson152-media-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  draft:
    if: github.head_ref == 'codex/lesson-152-malou-proposal' || (github.event_name == 'workflow_dispatch' && github.ref_name != 'codex/lesson-174-carole-handoff')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: remotion
      - run: npx remotion browser ensure
        working-directory: remotion
      - name: Bounded read-only published-state snapshot
        env:
          KB_LOADER_USERNAME: ${{ vars.KB_LOADER_USERNAME || 'training.loader' }}
          KB_LOADER_PASSWORD: ${{ secrets.KB_LOADER_PASSWORD }}
          KB_LOADER_ANON_KEY: ${{ secrets.PILOT_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/lesson-152-published-snapshot.mjs
      - name: Generate actual target-only draft media
        if: github.event_name != 'workflow_dispatch' && hashFiles('docs/lesson-152-owner-approval.json') == ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON152_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-152-record-fetch.mjs'
        run: node scripts/lesson-152-media-build.mjs
      - name: Full audio model review
        if: always() && github.event_name != 'workflow_dispatch' && hashFiles('docs/lesson-152-owner-approval.json') == ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON152_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-152-record-fetch.mjs'
        run: node scripts/lesson-152-audio-review.mjs
      - name: Decode and focused-review shipped media
        if: always() && github.event_name != 'workflow_dispatch' && hashFiles('docs/lesson-152-owner-approval.json') == ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON152_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-152-record-fetch.mjs'
        run: node scripts/lesson-152-audio-focus.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson152-draft-evidence
          path: |
            lesson-152-published-snapshot.json
            content/training/day1-basic-competencies/narration.json
            content/training/day1-basic-competencies/modules/05-bhw-at-barangay/lessons/bhw-barangay-partners/
            public/training/audio/05-bhw-at-barangay/bhw-barangay-partners/
            public/training/bhw-1-5/
            remotion/public/bhw-barangay-partners/
            docs/lesson-152-media-generation.json
            docs/lesson-152-audio-review.json
            docs/lesson-152-audio-focus.json
            .preview/lesson152-raw/
            .preview/lesson152-excerpts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  lesson174:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/lesson-174-carole-handoff'
    uses: ./.github/workflows/lesson174-media.yml
    secrets: inherit
