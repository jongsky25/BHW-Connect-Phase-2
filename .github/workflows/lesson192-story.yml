name: Lesson 1.9.2 draft story and decoded AAC review
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lesson192-story.yml'
      - 'scripts/lesson-192-story-build.mjs'
      - 'scripts/remotion-resources-safe-change-narrate.mjs'
      - 'remotion/src/resources-safe-change/**'
permissions:
  contents: read
concurrency:
  group: lesson192-story-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  draft-story:
    if: github.head_ref == 'codex/lesson-192-charlaine-handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Keep final selected story bytes immutable
        id: scope
        run: |
          if test -f docs/lesson-192-final-evidence-origins.json; then
            echo 'generate=false' >> "$GITHUB_OUTPUT"
          else
            echo 'generate=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.generate == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.generate == 'true'
      - run: npm ci
        if: steps.scope.outputs.generate == 'true'
        working-directory: remotion
      - run: npx remotion browser ensure
        if: steps.scope.outputs.generate == 'true'
        working-directory: remotion
      - name: Generate the two actual draft stories
        if: steps.scope.outputs.generate == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON192_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-192-record-fetch.mjs'
        run: node scripts/lesson-192-story-build.mjs
      - name: Review actual shipped AAC in full
        if: always() && steps.scope.outputs.generate == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON192_REVIEW_STORY_ONLY: '1'
          LESSON192_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-192-record-fetch.mjs'
        run: node scripts/lesson-192-audio-review.mjs
      - name: Review four focused decoded excerpts per story
        if: always() && steps.scope.outputs.generate == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON192_REVIEW_STORY_ONLY: '1'
          LESSON192_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-192-record-fetch.mjs'
        run: node scripts/lesson-192-audio-focus.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.generate == 'true'
        with:
          name: lesson192-story-evidence
          path: |
            content/training/day1-basic-competencies/modules/09-sustainable-practices/lessons/resources-safe-change/lesson.json
            public/training/bhw-1-9/resources-safe-change-*
            remotion/public/resources-safe-change/narration-*
            remotion/public/resources-safe-change/shipped-aac-*
            docs/lesson-192-story-generation.json
            docs/lesson-192-audio-*.json
            .preview/lesson192-raw/
            .preview/lesson192-excerpts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
