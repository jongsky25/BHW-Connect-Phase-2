name: CI

on:
  push:
    branches: [main]
  pull_request:

# Concurrency is deliberately per-JOB, not workflow-level. A workflow-level
# group applies its cancel-in-progress to every job, including `e2e` — and
# cancelling e2e mid-spec skips the `finally` that restores a global feature
# flag, leaking a mutated flag into the next run. That is not hypothetical:
# run #213 (the merge of PR #66) had its e2e job cancelled by the next push
# to main, landing in the Build step. Two minutes later it would have been
# mid-suite. So `checks` is cancellable and `e2e` is not — see each job.

jobs:
  # Everything that touches nothing shared: pure local checks, so these stay
  # fully parallel across PRs and give fast feedback. Safe to cancel — a new
  # push supersedes this ref's own in-flight checks and nothing is left dirty.
  checks:
    runs-on: ubuntu-latest
    concurrency:
      group: checks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  # Waits, first come first served, until no other run is using the shared
  # database (the pilot project). See the e2e job for why.
  e2e-wait:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.wait.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Wait for the shared database
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/wait-for-e2e-slot.sh

  e2e-shard:
    needs: e2e-wait
    # e2e-wait skips a PR run whose commit was superseded by a newer push
    # while it queued: nobody merges that commit, and a full suite on it only
    # adds load to the one shared database.
    if: needs.e2e-wait.outputs.run == 'true'
    name: e2e-shard (${{ matrix.shard }}/4)
    # The suite runs as four short chunks, ONE AT A TIME (max-parallel: 1):
    # parallel shards would multiply load on the one shared database, the
    # opposite of the point. Small chunks give the database gaps to recover
    # between them, a failed chunk can be re-run alone instead of replaying
    # the whole suite, and fail-fast skips the chunks that haven't started
    # yet once one fails. Those were never started, so cancelling them can't
    # interrupt a spec mid-flag-toggle (see below).
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    # Every PR's e2e run shares ONE Supabase project (the pilot), and four specs toggle
    # GLOBAL feature flags (`chat_conversation`, `offline_pwa`, `kb_articles`,
    # `course_sessions`) — each flips a flag, asserts, and restores it in a
    # `finally`. That is safe within a run only because playwright.config.ts
    # pins `workers: 1`, but NOT across runs: two PRs' e2e jobs overlapping means
    # one flips a flag while the other is asserting its resting value. That is
    # exactly what broke CI on 20 Sep 2026, when several PRs ran at once and
    # chat-conversation.spec.ts failed on `expect(before.route).toBeUndefined()`
    # receiving "red_flag" — the other run had turned `chat_conversation` on.
    # So only one run may touch the project at a time, and nothing may cancel
    # a running e2e job: cancelling mid-spec skips the `finally` that restores
    # the flag, leaking a mutated flag into the next run. There is no
    # workflow-level concurrency group, so nothing upstream cancels this job.
    #
    # e2e-wait does the queueing. A concurrency group alone cannot: it holds
    # only ONE pending job, and each newly queued e2e cancelled the one already
    # waiting, so with several PRs open e2e jobs were cancelled before they
    # ever started (PR #130's, three times on 26 Sep 2026). The group below
    # stays as a safety net: e2e-wait lets one run through at a time, so it is
    # not contended, and it keeps runs on an older ci.yml from overlapping.
    concurrency:
      group: e2e-shared-supabase-project
      cancel-in-progress: false
    env:
      # The pilot project is the ONE database for this phase: the live app,
      # the content loaders and this E2E run all use it (the separate
      # `bhw-connect-e2e` project is retired — see docs/deploy-runbook.md's
      # "One database" section). While the pilot holds only test data, E2E
      # writing into it is intended; revisit before real BHWs are onboarded.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_STABLE_BHW_PASSWORD: ${{ secrets.E2E_STABLE_BHW_PASSWORD }}
      E2E_STABLE_ADMIN_PASSWORD: ${{ secrets.E2E_STABLE_ADMIN_PASSWORD }}
      E2E_OTHER_BARANGAY_BHW_PASSWORD: ${{ secrets.E2E_OTHER_BARANGAY_BHW_PASSWORD }}
      E2E_STABLE_CITY_ADMIN_PASSWORD: ${{ secrets.E2E_STABLE_CITY_ADMIN_PASSWORD }}
      # Super-admin-only RPCs (rpc_flag_toggle, rpc_flag_set_role — see
      # docs/role-feature-toggles-plan.md §5 A1) need this, not a plain
      # admin token.
      E2E_STABLE_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_STABLE_SUPER_ADMIN_PASSWORD }}
      # The pilot has ai_external + ai_gap_draft on, so e2e/ai-gap-draft.spec.ts
      # runs its real round trip here and needs a provider key; each run
      # spends a small amount of Gemini quota. GEMINI_MODEL is optional.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Fail in seconds, with a plain message, when the shared database can't
      # serve requests (e.g. PostgREST stuck on 503 PGRST002 because its
      # schema-cache query keeps hitting the statement timeout). Running the
      # suite against it anyway turns into a 1.5h run of timeouts and retries
      # that loads the database further while it's trying to recover.
      - name: Check the shared database is serving requests
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
              "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/feature_flags?select=key&limit=1")
            if [ "$status" -ge 200 ] && [ "$status" -lt 500 ]; then
              echo "Shared database OK (HTTP $status)"
              exit 0
            fi
            echo "Attempt $attempt: shared database returned HTTP $status; retrying in 30s"
            sleep 30
          done
          echo "::error::The shared Supabase database is not serving requests (last HTTP $status). This is an infrastructure problem, not a test failure — check the project's health in the Supabase dashboard before re-running."
          exit 1

      - name: E2E smoke tests (chunk ${{ matrix.shard }} of 4)
        run: npm run e2e -- --shard=${{ matrix.shard }}/4
        env:
          CI: true

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Once per run, not once per chunk.
      - name: Performance budget check (Lighthouse)
        if: matrix.shard == 4
        run: npx lhci autorun --config=lighthouserc.js

  # A single, stable "e2e" check for branch protection and reviewers, since
  # the chunks above report as "e2e-shard (n/4)". Passes when every chunk
  # passed, or when e2e-wait skipped them for a superseded commit.
  e2e:
    needs: [e2e-wait, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize the e2e chunks
        run: |
          echo "e2e-wait: ${{ needs.e2e-wait.result }}, chunks: ${{ needs.e2e-shard.result }}"
          case "${{ needs.e2e-wait.result }}/${{ needs.e2e-shard.result }}" in
            success/success|success/skipped) exit 0 ;;
            *) exit 1 ;;
          esac
