name: CI

on:
  push:
    branches: [main]
  pull_request:

# Concurrency is deliberately per-JOB, not workflow-level. A workflow-level
# group applies its cancel-in-progress to every job, including `e2e` — and
# cancelling e2e mid-spec skips the `finally` that restores a global feature
# flag, leaking a mutated flag into the next run. That is not hypothetical:
# run #213 (the merge of PR #66) had its e2e job cancelled by the next push
# to main, landing in the Build step. Two minutes later it would have been
# mid-suite. So `checks` is cancellable and `e2e` is not — see each job.

jobs:
  # Everything that touches nothing shared: pure local checks, so these stay
  # fully parallel across PRs and give fast feedback. Safe to cancel — a new
  # push supersedes this ref's own in-flight checks and nothing is left dirty.
  checks:
    runs-on: ubuntu-latest
    concurrency:
      group: checks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    # Every PR's e2e run shares ONE Supabase project, and four specs toggle
    # GLOBAL feature flags (`chat_conversation`, `offline_pwa`, `kb_articles`,
    # `course_sessions`) — each flips a flag, asserts, and restores it in a
    # `finally`. That is safe within a run (Playwright runs the suite with a
    # single worker) but NOT across runs: two PRs' e2e jobs overlapping means
    # one flips a flag while the other is asserting its resting value. That is
    # exactly what broke CI on 20 Sep 2026, when several PRs ran at once and
    # chat-conversation.spec.ts failed on `expect(before.route).toBeUndefined()`
    # receiving "red_flag" — the other run had turned `chat_conversation` on.
    # This group queues e2e repo-wide so only one run touches the project at a
    # time. `cancel-in-progress: false` matters: cancelling a run mid-spec
    # skips the `finally` that restores the flag, which would leak a mutated
    # flag into the next run and break it deterministically. Because there is
    # no workflow-level group, nothing upstream can cancel this job either.
    concurrency:
      group: e2e-shared-supabase-project
      cancel-in-progress: false
    env:
      # Points at a dedicated Supabase project used only for CI/E2E, never
      # the pilot project — see docs/deploy-runbook.md. Do NOT reuse the
      # NEXT_PUBLIC_SUPABASE_URL/ANON_KEY secrets here; those name the pilot
      # project and back the retention-purge workflow and production.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_STABLE_BHW_PASSWORD: ${{ secrets.E2E_STABLE_BHW_PASSWORD }}
      E2E_STABLE_ADMIN_PASSWORD: ${{ secrets.E2E_STABLE_ADMIN_PASSWORD }}
      E2E_OTHER_BARANGAY_BHW_PASSWORD: ${{ secrets.E2E_OTHER_BARANGAY_BHW_PASSWORD }}
      E2E_STABLE_CITY_ADMIN_PASSWORD: ${{ secrets.E2E_STABLE_CITY_ADMIN_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: E2E smoke tests
        run: npm run e2e
        env:
          CI: true

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Performance budget check (Lighthouse)
        run: npx lhci autorun --config=lighthouserc.js
