name: Lesson 1.6.5 draft evidence and media
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lesson165-media.yml'
      - 'scripts/lesson-165-*'
      - 'scripts/remotion-communication-handoff-narrate.mjs'
      - 'scripts/lib/communication-handoff-speech.mjs'
      - 'content/training/day1-basic-competencies/modules/06-komunikasyon/lessons/communication-handoff/**'
      - 'remotion/src/communication-handoff/**'
      - 'docs/lesson-165-*.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: lesson165-media-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  draft:
    if: github.head_ref == 'codex/lesson-165-enhancement-handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: remotion
      - run: npx remotion browser ensure
        working-directory: remotion
      - name: Install encoded-media verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Retain hash-pinned raw evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lesson-165-retain-evidence.mjs
      - name: Bounded read-only published-state baseline
        env:
          KB_LOADER_USERNAME: ${{ vars.KB_LOADER_USERNAME || 'training.loader' }}
          KB_LOADER_PASSWORD: ${{ secrets.KB_LOADER_PASSWORD }}
          KB_LOADER_ANON_KEY: ${{ secrets.PILOT_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/lesson-165-published-snapshot.mjs
      - name: Generate target-only actual narration and two measured stories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON165_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-165-record-fetch.mjs'
        run: node scripts/lesson-165-media-build.mjs
      - name: Full actual Read and shipped AAC review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON165_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-165-record-fetch.mjs'
        run: node scripts/lesson-165-audio-review.mjs
      - name: Decode and focused-review all shipped media
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON165_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-165-record-fetch.mjs'
        run: node scripts/lesson-165-audio-focus.mjs
      - name: Summarize retained full and focused concerns
        run: node scripts/lesson-165-audio-notes.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lesson165-completed-audio-reviews
          path: |
            docs/lesson-165-audio-review.json
            docs/lesson-165-audio-focus.json
            docs/lesson-165-audio-review-notes.json
            .preview/lesson165-raw/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Final frozen-source draft review
        env:
          GH_TOKEN: ${{ github.token }}
        # Generated bytes must first be reviewed and committed; initial generation only exports.
        run: |
          if ! git diff --quiet -- content/training/day1-basic-competencies/narration.json content/training/day1-basic-competencies/modules/06-komunikasyon/lessons/communication-handoff; then
            echo 'Generated source/media requires author review and commit before final package.'
            exit 0
          fi
          python3 -m pip install PyMuPDF==1.26.6
          python3 scripts/lesson-165-source-evidence.py
          node scripts/lesson-165-media-verify.mjs
          node scripts/lesson-165-encoded-verify.mjs
          node scripts/lesson-165-review-build.mjs
          node scripts/lesson-165-browser-verify.mjs
          node scripts/lesson-165-print-kit.mjs
          node scripts/lesson-165-wait-ci.mjs
          node scripts/lesson-165-review-verify.mjs
          node scripts/lesson-165-package.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson165-generated-media
          path: |
            lesson-165-published-snapshot.json
            content/training/day1-basic-competencies/narration.json
            content/training/day1-basic-competencies/modules/06-komunikasyon/lessons/communication-handoff/
            public/training/audio/06-komunikasyon/communication-handoff/
            public/training/bhw-1-6/communication-handoff-*
            remotion/public/communication-handoff/
            docs/lesson-165-audio*.json
            docs/lesson-165-media-generation.json
          if-no-files-found: error
          retention-days: 30
      - name: Export raw evidence once
        if: always()
        run: |
          mkdir -p .preview/lesson165-raw-export
          if [ -f .preview/lesson165-evidence-archives/lesson165-raw-evidence.zip ]; then
            cp .preview/lesson165-evidence-archives/* .preview/lesson165-raw-export/
          elif [ -d .preview/lesson165-raw ]; then
            cp -a .preview/lesson165-raw/. .preview/lesson165-raw-export/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson165-raw-evidence
          path: .preview/lesson165-raw-export/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson165-review-package
          path: |
            .preview/lesson165-deliverables/lesson-1.6.5-gibs-review.zip
            .preview/lesson165-deliverables/lesson-165-package-integrity.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
