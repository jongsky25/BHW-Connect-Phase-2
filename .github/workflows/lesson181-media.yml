name: Lesson 1.8.1 draft media generation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lesson181-media.yml'
      - 'docs/lesson-181-authored-screens.json'
      - 'scripts/lesson-181-media-build.mjs'
      - 'scripts/remotion-safety-identify-narrate.mjs'
      - 'scripts/lib/safety-identify-speech.mjs'
permissions:
  contents: read
concurrency:
  group: lesson181-media-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  draft:
    if: github.head_ref == 'codex/lesson-181-apple-handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Generate only before evidence is frozen
        id: scope
        run: |
          if test -f docs/lesson-181-evidence-origins.json; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.generate == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.scope.outputs.generate == 'true'
        run: npm ci
      - if: steps.scope.outputs.generate == 'true'
        run: npm ci
        working-directory: remotion
      - if: steps.scope.outputs.generate == 'true'
        run: npx remotion browser ensure
        working-directory: remotion
      - name: Bounded read-only published snapshot
        if: steps.scope.outputs.generate == 'true'
        env:
          KB_LOADER_USERNAME: ${{ vars.KB_LOADER_USERNAME || 'training.loader' }}
          KB_LOADER_PASSWORD: ${{ secrets.KB_LOADER_PASSWORD }}
          KB_LOADER_ANON_KEY: ${{ secrets.PILOT_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        continue-on-error: true
        run: node scripts/lesson-181-published-snapshot.mjs
      - name: Generate only target draft media and preserve old media
        if: steps.scope.outputs.generate == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON181_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-181-record-fetch.mjs'
        run: node scripts/lesson-181-media-build.mjs
      - name: Full review of actual Read MP3 and shipped AAC
        if: always() && steps.scope.outputs.generate == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON181_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-181-record-fetch.mjs'
        run: node scripts/lesson-181-audio-review.mjs
      - name: Decode and review fifty-six focused excerpts
        if: always() && steps.scope.outputs.generate == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON181_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-181-record-fetch.mjs'
        run: node scripts/lesson-181-audio-focus.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.generate == 'true'
        with:
          name: lesson181-generated-evidence
          path: |
            lesson-181-published-snapshot.json
            content/training/day1-basic-competencies/narration.json
            content/training/day1-basic-competencies/modules/08-osh/lessons/safety-identify/
            public/training/audio/08-osh/safety-identify/
            public/training/bhw-1-8/safety-identify-*
            remotion/public/safety-identify/narration-*
            remotion/public/safety-identify/shipped-aac-*
            docs/lesson-181-media-generation.json
            docs/lesson-181-audio-*.json
            .preview/lesson181-raw/
            .preview/lesson181-excerpts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
