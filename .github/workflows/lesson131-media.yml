name: Lesson 1.3.1 draft Gemini media

on:
  push:
    branches: [codex/lesson-131-story-gemini]
    paths:
      - .github/workflows/lesson131-media.yml
      - scripts/lesson-131-media-build.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lesson131-draft-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-media:
    if: github.ref == 'refs/heads/codex/lesson-131-story-gemini'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: remotion
      - run: npx remotion browser ensure
        working-directory: remotion
      - name: Generate lesson 1.3.1 media and affected Mimi rename tracks
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/lesson-131-media-build.mjs
      - name: Save review artifacts, including completed partial tracks on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson131-draft-media
          retention-days: 14
          path: |
            content/training/day1-basic-competencies/narration.json
            content/training/day1-basic-competencies/modules/03-polisiya-bhs/lessons/bhs-promotions/lesson.json
            public/training/audio/03-polisiya-bhs/bhs-promotions/
            public/training/audio/03-polisiya-bhs/bhs-decline/
            public/training/audio/03-polisiya-bhs/bhs-resources/
            public/training/bhw-1-3/bhs-promotions-gemini-*
            remotion/public/bhs-promotions/
            remotion/src/Root.tsx
            docs/lesson-131-media-generation.json
          if-no-files-found: error
