name: Lesson 1.3.3 draft Gemini media

on:
  push:
    branches: [codex/lesson-133-story-gemini]
    paths:
      - .github/workflows/lesson133-media.yml
      - scripts/lesson-133-media-build.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lesson133-draft-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-media:
    if: github.ref == 'refs/heads/codex/lesson-133-story-gemini'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: remotion
      - run: npx remotion browser ensure
        working-directory: remotion
      - name: Generate lesson 1.3.3 media
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/lesson-133-media-build.mjs
      - name: Model-mediated audio review of actual completed tracks
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/lesson-133-audio-review.mjs
      - name: Save review artifacts, including completed partial tracks on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson133-draft-media
          retention-days: 14
          path: |
            content/training/day1-basic-competencies/narration.json
            content/training/day1-basic-competencies/modules/03-polisiya-bhs/lessons/bhs-decline/lesson.json
            public/training/audio/03-polisiya-bhs/bhs-decline/
            public/training/bhw-1-3/bhs-decline-gemini-*
            remotion/public/bhs-decline/
            remotion/src/Root.tsx
            docs/lesson-133-media-generation.json
            docs/lesson-133-audio-review.json
          if-no-files-found: error
