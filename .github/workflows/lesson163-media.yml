name: Lesson 1.6.3 draft evidence and media
on:
  workflow_dispatch:
    inputs:
      story_context_fix:
        description: Generate the two revised item 12 story recordings and clips
        type: boolean
        default: false
      package:
        description: Build final package after exact-head CI and registry pass
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lesson163-media.yml'
      - 'scripts/lesson-163-*'
      - 'scripts/remotion-communication-explain-narrate.mjs'
      - 'scripts/tests/lesson-163*'
      - 'content/training/day1-basic-competencies/modules/06-komunikasyon/lessons/communication-explain/**'
      - 'remotion/src/communication-explain/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: lesson163-media-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  draft:
    if: (github.head_ref == 'codex/lesson-163-enhancement-handoff' || github.event_name == 'workflow_dispatch') && inputs.story_context_fix != true && !contains(github.event.pull_request.title, 'Approved release')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: remotion
      - run: npx remotion browser ensure
        working-directory: remotion
      - name: Select initial generation or final review packaging
        id: phase
        run: |
          if test -f docs/lesson-163-evidence-cache.json; then
            echo "package=true" >> "$GITHUB_OUTPUT"
          else
            echo "package=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install full FFmpeg for independent decoded-frame verification
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Restore hash-pinned exact-byte evidence cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lesson-163-retain-evidence.mjs
      - name: Bounded read-only published-state snapshot
        env:
          KB_LOADER_USERNAME: ${{ vars.KB_LOADER_USERNAME || 'training.loader' }}
          KB_LOADER_PASSWORD: ${{ secrets.KB_LOADER_PASSWORD }}
          KB_LOADER_ANON_KEY: ${{ secrets.PILOT_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/lesson-163-published-snapshot.mjs
      - name: Generate actual target-only draft media
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON163_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-163-record-fetch.mjs'
        run: node scripts/lesson-163-media-build.mjs
      - name: Verify measured media and protected history
        run: node scripts/lesson-163-media-verify.mjs
      - name: Full review of twelve Read tracks and both shipped AAC stories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON163_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-163-record-fetch.mjs'
        run: node scripts/lesson-163-audio-review.mjs
      - name: Fifty-six focused excerpt reviews
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON163_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-163-record-fetch.mjs'
        run: node scripts/lesson-163-audio-focus.mjs
      - name: Retrieve hash-verified source excerpts
        run: |
          python3 -m pip install PyMuPDF==1.26.6
          python3 scripts/lesson-163-source-evidence.py
      - name: Build actual-component self-contained review
        run: node scripts/lesson-163-review-build.mjs
      - name: Desktop/mobile offline playback and completion
        run: node scripts/lesson-163-browser-verify.mjs
      - name: Print bilingual role cards, observer checklist and task aid
        run: node scripts/lesson-163-print-kit.mjs
      - name: Wait for normal CI and full registry at exact head
        if: inputs.package == true || steps.phase.outputs.package == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lesson-163-wait-ci.mjs
      - name: Verify and package the frozen review
        if: inputs.package == true || steps.phase.outputs.package == 'true'
        run: |
          node scripts/lesson-163-review-verify.mjs
          node scripts/lesson-163-package.mjs
      - uses: actions/upload-artifact@v4
        if: always() && inputs.package != true && steps.phase.outputs.package != 'true'
        with:
          name: lesson163-generated-evidence
          path: |
            lesson-163-published-snapshot.json
            content/training/day1-basic-competencies/narration.json
            content/training/day1-basic-competencies/modules/06-komunikasyon/lessons/communication-explain/
            public/training/audio/06-komunikasyon/communication-explain/
            public/training/bhw-1-6/communication-explain-*
            docs/lesson-163-*.json
            remotion/public/communication-explain/
            .preview/lesson163-raw/
            .preview/lesson163-excerpts/
            .preview/lesson163-decoded/
            .preview/lesson163-source/
            .preview/lesson163-deliverables/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success() && (inputs.package == true || steps.phase.outputs.package == 'true')
        with:
          name: lesson163-review-package
          path: |
            .preview/lesson163-deliverables/lesson-1.6.3-gibs-review.zip
            .preview/lesson163-deliverables/lesson-163-package-integrity.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.package == true || steps.phase.outputs.package == 'true')
        with:
          name: lesson163-review-raw-evidence
          path: |
            .preview/lesson163-deliverables/lesson-1.6.3-raw-evidence.zip
            .preview/lesson163-deliverables/lesson-163-raw-evidence-integrity.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  item12_context_media:
    if: github.event_name == 'workflow_dispatch' && inputs.story_context_fix == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: remotion
      - run: npx remotion browser ensure
        working-directory: remotion
      - name: Generate exact revised Filipino and English narration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # The original authored source stays unchanged in git. This isolated
          # media job compiles the successor through the original composition.
          cp remotion/src/communication-explain/narration-context.ts remotion/src/communication-explain/narration.ts
          node scripts/remotion-communication-explain-narrate.mjs fil
          node scripts/remotion-communication-explain-narrate.mjs en
      - name: Render revised six-scene clips and measured captions
        run: |
          node scripts/remotion-render.mjs CommunicationExplainStoryFil communication-explain-context-fil --public training/bhw-1-6 --with-audio --captions communication-explain/narration-fil.json
          node scripts/remotion-render.mjs CommunicationExplainStoryEn communication-explain-context-en --public training/bhw-1-6 --with-audio --captions communication-explain/narration-en.json
          cp remotion/public/communication-explain/narration-fil.mp3 remotion/public/communication-explain/narration-context-fil.mp3
          cp remotion/public/communication-explain/narration-fil.json remotion/public/communication-explain/narration-context-fil.json
          cp remotion/public/communication-explain/narration-en.mp3 remotion/public/communication-explain/narration-context-en.mp3
          cp remotion/public/communication-explain/narration-en.json remotion/public/communication-explain/narration-context-en.json
      - name: Review actual spoken audio against revised source
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/feedback-item-12-audio-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-item-12-story-media
          path: |
            remotion/public/communication-explain/narration-context-fil.mp3
            remotion/public/communication-explain/narration-context-fil.json
            remotion/public/communication-explain/narration-context-en.mp3
            remotion/public/communication-explain/narration-context-en.json
            public/training/bhw-1-6/communication-explain-context-*
            docs/feedback-remediation/feedback-item-12-audio-review.json
          if-no-files-found: error
          retention-days: 14
