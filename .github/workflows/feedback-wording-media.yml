name: Feedback first-nine wording narration
on:
  push:
    branches: [fix/feedback-first-nine-dispositions]
    paths: [.github/workflows/feedback-wording-media.yml, scripts/feedback-wording-media.mjs, docs/feedback-remediation/first-nine-wording-releases.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narration:
    if: github.ref == 'refs/heads/fix/feedback-first-nine-dispositions'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node scripts/feedback-wording-media.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: node scripts/feedback-wording-audio-review.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-wording-narration
          path: feedback-wording-media/
          retention-days: 7
