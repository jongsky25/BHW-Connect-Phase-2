name: Lesson 1.3.2 draft audio review
on:
  push:
    branches: [codex/lesson-132-story-gemini]
    paths:
      - .github/workflows/lesson-132-draft-audio.yml
      - scripts/lesson-132-audio-review.mjs
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Model-mediated listening of final Read and story speech
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/lesson-132-audio-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-132-audio-review
          path: remotion/public/bhs-support-environment/audio-review.json
          retention-days: 7
