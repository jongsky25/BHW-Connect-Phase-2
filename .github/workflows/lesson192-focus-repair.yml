name: Lesson 1.9.2 exact-byte focused review retry
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lesson192-focus-repair.yml'
permissions:
  contents: read
jobs:
  retry:
    if: github.head_ref == 'codex/lesson-192-charlaine-handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: scope
        run: |
          if test -f docs/lesson-192-audio-review-complete.json; then
            echo 'review=false' >> "$GITHUB_OUTPUT"
          else
            echo 'review=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.review == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.review == 'true'
      - run: npm ci
        if: steps.scope.outputs.review == 'true'
        working-directory: remotion
      - name: Retry only missing actual-byte model responses; reuse exact WAV receipts
        if: steps.scope.outputs.review == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON192_RAW_EVIDENCE: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/scripts/lesson-192-record-fetch.mjs'
        run: |
          node scripts/lesson-192-audio-focus.mjs
          node --input-type=module - <<'JS'
          import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('docs/lesson-192-audio-focus.json'));
          if(r.successful_model_reviews!==56||r.provider_failures)throw Error('Focused model review still incomplete; failure retained');
          JS
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.review == 'true'
        with:
          name: lesson192-focused-review-retry
          path: |
            docs/lesson-192-audio-focus.json
            .preview/lesson192-raw/
            .preview/lesson192-excerpts/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
