<svg viewBox="0 0 640 400">
  <title>Unsafe cut versus safe conservation</title>
  <g fill="currentColor" text-anchor="middle">
    <rect x="30" y="40" width="270" height="320" rx="10" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="165" y="80" font-size="16" font-weight="700">Unsafe / Di-ligtas</text>
    <text x="165" y="178" font-size="13">Cut handwashing water</text>
    <text x="165" y="200" font-size="13">Reuse clinical single-use items</text>
    <rect x="340" y="40" width="270" height="320" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="475" y="80" font-size="16" font-weight="700">Safer / Mas ligtas</text>
    <text x="475" y="178" font-size="13">Repair the leak</text>
    <text x="475" y="200" font-size="13">Reuse teaching visuals</text>
    <text x="475" y="305" font-size="12">Check local policy first</text>
  </g>
</svg>

