<svg viewBox="0 0 640 400">
  <title>Hub-and-spoke: replace "Hub" and the four "Spoke N" labels</title>
  <defs>
    <marker id="hs-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" />
    </marker>
  </defs>
  <g>
    <line x1="320" y1="200" x2="320" y2="70" stroke="currentColor" stroke-width="2" marker-end="url(#hs-arrow)" />
    <line x1="320" y1="200" x2="450" y2="200" stroke="currentColor" stroke-width="2" marker-end="url(#hs-arrow)" />
    <line x1="320" y1="200" x2="320" y2="330" stroke="currentColor" stroke-width="2" marker-end="url(#hs-arrow)" />
    <line x1="320" y1="200" x2="190" y2="200" stroke="currentColor" stroke-width="2" marker-end="url(#hs-arrow)" />
  </g>
  <g>
    <circle cx="320" cy="200" r="52" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="320" y="200" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700">Hub</text>
  </g>
  <g>
    <circle cx="320" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="320" y="50" text-anchor="middle" dominant-baseline="middle" font-size="12">Spoke 1</text>
    <circle cx="490" cy="200" r="34" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="490" y="200" text-anchor="middle" dominant-baseline="middle" font-size="12">Spoke 2</text>
    <circle cx="320" cy="350" r="34" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="320" y="350" text-anchor="middle" dominant-baseline="middle" font-size="12">Spoke 3</text>
    <circle cx="150" cy="200" r="34" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="150" y="200" text-anchor="middle" dominant-baseline="middle" font-size="12">Spoke 4</text>
  </g>
</svg>
