<svg viewBox="0 0 640 400">
  <title>Chain: a left-to-right sequence — replace each "Step N" and add/remove boxes as needed</title>
  <defs>
    <marker id="chain-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" />
    </marker>
  </defs>
  <g>
    <rect x="20" y="170" width="130" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="85" y="200" text-anchor="middle" dominant-baseline="middle" font-size="13">Step 1</text>

    <line x1="150" y1="200" x2="250" y2="200" stroke="currentColor" stroke-width="2" marker-end="url(#chain-arrow)" />

    <rect x="255" y="170" width="130" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="320" y="200" text-anchor="middle" dominant-baseline="middle" font-size="13">Step 2</text>

    <line x1="385" y1="200" x2="485" y2="200" stroke="currentColor" stroke-width="2" marker-end="url(#chain-arrow)" />

    <rect x="490" y="170" width="130" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="555" y="200" text-anchor="middle" dominant-baseline="middle" font-size="13">Step 3</text>
  </g>
</svg>
