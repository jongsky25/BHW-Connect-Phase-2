  </defs>
  <g>
    <rect x="20" y="170" width="135" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="87" y="192" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700">Magrehistro</text>
    <text x="87" y="210" text-anchor="middle" dominant-baseline="middle" font-size="9">sa local health board</text>

    <line x1="155" y1="200" x2="185" y2="200" stroke="currentColor" stroke-width="2" marker-end="url(#ra7883-arrow)" />

    <rect x="190" y="170" width="135" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="257" y="192" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700">Susuriin</text>
