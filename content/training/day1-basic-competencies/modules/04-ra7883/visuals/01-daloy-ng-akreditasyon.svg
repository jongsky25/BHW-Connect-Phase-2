    <line x1="495" y1="200" x2="525" y2="200" stroke="currentColor" stroke-width="2" marker-end="url(#ra7883-arrow)" />

    <rect x="530" y="170" width="95" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="577" y="192" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700">Eligible</text>
