<svg viewBox="0 0 640 400">
  <title>Hub-and-spoke: ang HEPO sa gitna, tatlong tungkulin sa paligid</title>
  <defs>
    <marker id="role-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" />
    </marker>
  </defs>
  <g>
    <line x1="320" y1="150" x2="320" y2="72" stroke="currentColor" stroke-width="2" marker-end="url(#role-arrow)" />
    <line x1="268" y1="222" x2="168" y2="285" stroke="currentColor" stroke-width="2" marker-end="url(#role-arrow)" />
    <line x1="372" y1="222" x2="472" y2="285" stroke="currentColor" stroke-width="2" marker-end="url(#role-arrow)" />
  </g>
  <g>
    <circle cx="320" cy="190" r="62" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="320" y="180" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700">HEPO</text>
    <text x="320" y="202" text-anchor="middle" dominant-baseline="middle" font-size="10">BHW sa barangay</text>
  </g>
  <g>
