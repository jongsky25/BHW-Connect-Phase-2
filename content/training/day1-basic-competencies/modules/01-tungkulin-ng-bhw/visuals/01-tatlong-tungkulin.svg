    <text x="320" y="36" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700">Health Educator</text>
    <text x="320" y="55" text-anchor="middle" dominant-baseline="middle" font-size="10">nagtuturo bago magkasakit</text>

    <rect x="20" y="290" width="215" height="52" rx="8" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="128" y="308" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700">Community Organizer</text>
    <text x="128" y="327" text-anchor="middle" dominant-baseline="middle" font-size="10">tulay at tagapagbuklod</text>

    <rect x="405" y="290" width="215" height="52" rx="8" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="513" y="308" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700">Health Service Provider</text>
    <text x="513" y="327" text-anchor="middle" dominant-baseline="middle" font-size="10">unang nasasalubong</text>
