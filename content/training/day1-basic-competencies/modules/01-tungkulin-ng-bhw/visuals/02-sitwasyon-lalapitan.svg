<svg viewBox="0 0 640 400">
  <title>Tatlong hakbang: unawain ang sitwasyon, tukuyin ang ugnayan, lapitan ang tamang tao</title>
  <defs>
    <marker id="step-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" />
    </marker>
  </defs>
  <g>
    <rect x="15" y="160" width="170" height="80" rx="8" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="100" y="192" text-anchor="middle" dominant-baseline="middle" font-size="13">1. Unawain ang</text>
    <text x="100" y="212" text-anchor="middle" dominant-baseline="middle" font-size="13">sitwasyon</text>

    <line x1="185" y1="200" x2="245" y2="200" stroke="currentColor" stroke-width="2" marker-end="url(#step-arrow)" />

    <rect x="250" y="160" width="170" height="80" rx="8" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="335" y="192" text-anchor="middle" dominant-baseline="middle" font-size="13">2. Tukuyin ang</text>
    <text x="335" y="212" text-anchor="middle" dominant-baseline="middle" font-size="13">bagay na ugnayan</text>

    <line x1="420" y1="200" x2="480" y2="200" stroke="currentColor" stroke-width="2" marker-end="url(#step-arrow)" />

    <rect x="485" y="160" width="150" height="80" rx="8" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="560" y="192" text-anchor="middle" dominant-baseline="middle" font-size="13">3. Lapitan ang</text>
    <text x="560" y="212" text-anchor="middle" dominant-baseline="middle" font-size="13">tamang tao</text>
  </g>
</svg>
