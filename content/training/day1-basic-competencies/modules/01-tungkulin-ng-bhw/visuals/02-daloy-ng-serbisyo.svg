<svg viewBox="0 0 640 400">
  <title>Daloy ng serbisyo: mula sa pangangailangan, sa BHW, sa midwife, pabalik sa pagsubaybay</title>
  <defs>
    <marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" />
    </marker>
  </defs>
  <g>
    <rect x="15" y="100" width="140" height="74" rx="8" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="85" y="128" text-anchor="middle" dominant-baseline="middle" font-size="12">Pangangailangan</text>
    <text x="85" y="148" text-anchor="middle" dominant-baseline="middle" font-size="10">sa kabahayan</text>

    <line x1="155" y1="137" x2="205" y2="137" stroke="currentColor" stroke-width="2" marker-end="url(#flow-arrow)" />

    <rect x="210" y="100" width="150" height="74" rx="8" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="285" y="122" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700">BHW</text>
    <text x="285" y="142" text-anchor="middle" dominant-baseline="middle" font-size="10">unang nasasalubong</text>
    <text x="285" y="159" text-anchor="middle" dominant-baseline="middle" font-size="10">paunang serbisyo, tala</text>

    <line x1="360" y1="137" x2="410" y2="137" stroke="currentColor" stroke-width="2" marker-end="url(#flow-arrow)" />

    <rect x="415" y="100" width="150" height="74" rx="8" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="490" y="128" text-anchor="middle" dominant-baseline="middle" font-size="12">Midwife / RHU</text>
    <text x="490" y="148" text-anchor="middle" dominant-baseline="middle" font-size="10">kung kailangan</text>

    <path d="M490,174 L490,255 L285,255" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#flow-arrow)" />

    <rect x="140" y="272" width="290" height="62" rx="8" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="285" y="294" text-anchor="middle" dominant-baseline="middle" font-size="12">Pagsubaybay ng BHW</text>
    <text x="285" y="315" text-anchor="middle" dominant-baseline="middle" font-size="10">dito nagpapatuloy ang pangangalaga</text>
  </g>
</svg>
