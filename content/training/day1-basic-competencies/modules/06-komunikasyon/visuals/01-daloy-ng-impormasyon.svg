<svg viewBox="0 0 640 400"><title>Mula sa pakikinig tungo sa pagkilos / From listening to action</title>
<g><rect x="40" y="20" width="560" height="62" rx="8" fill="none" stroke="currentColor" stroke-width="2"/><text x="320" y="45" text-anchor="middle" font-size="19">Makinig at magtanong</text><text x="320" y="67" text-anchor="middle" font-size="16">Listen and ask</text></g>
<path d="M320,80 L320,102 M313,95 L320,102 L327,95" fill="none" stroke="currentColor" stroke-width="2" />
<g><rect x="40" y="105" width="560" height="62" rx="8" fill="none" stroke="currentColor" stroke-width="2"/><text x="320" y="130" text-anchor="middle" font-size="19">Suriin ang pinagmulan</text><text x="320" y="152" text-anchor="middle" font-size="16">Assess the source</text></g>
<path d="M320,165 L320,187 M313,180 L320,187 L327,180" fill="none" stroke="currentColor" stroke-width="2" />
<g><rect x="40" y="190" width="560" height="62" rx="8" fill="none" stroke="currentColor" stroke-width="2"/><text x="320" y="215" text-anchor="middle" font-size="19">Itala at ilahad</text><text x="320" y="237" text-anchor="middle" font-size="16">Record and present</text></g>
<path d="M320,250 L320,272 M313,265 L320,272 L327,265" fill="none" stroke="currentColor" stroke-width="2" />
<g><rect x="40" y="275" width="560" height="62" rx="8" fill="none" stroke="currentColor" stroke-width="2"/><text x="320" y="300" text-anchor="middle" font-size="19">Kumpirmahin ang susunod</text><text x="320" y="322" text-anchor="middle" font-size="16">Confirm the next step</text></g>
</svg>
