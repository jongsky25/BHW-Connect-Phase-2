<svg viewBox="0 0 640 400"><title>Apat na batayan ng prayoridad / Four priority criteria</title>
<g><rect x="40" y="20" width="560" height="62" rx="8" fill="none" stroke="currentColor" stroke-width="2"/><text x="320" y="45" text-anchor="middle" font-size="19">Laki — ilan ang apektado?</text><text x="320" y="67" text-anchor="middle" font-size="16">Magnitude — how many?</text></g>
<path d="M320,80 L320,102 M313,95 L320,102 L327,95" fill="none" stroke="currentColor" stroke-width="2" />
<g><rect x="40" y="105" width="560" height="62" rx="8" fill="none" stroke="currentColor" stroke-width="2"/><text x="320" y="130" text-anchor="middle" font-size="19">Kabigatan — gaano kalala?</text><text x="320" y="152" text-anchor="middle" font-size="16">Severity — how serious?</text></g>
<path d="M320,165 L320,187 M313,180 L320,187 L327,180" fill="none" stroke="currentColor" stroke-width="2" />
<g><rect x="40" y="190" width="560" height="62" rx="8" fill="none" stroke="currentColor" stroke-width="2"/><text x="320" y="215" text-anchor="middle" font-size="19">Kakayahan — kaya bang tugunan?</text><text x="320" y="237" text-anchor="middle" font-size="16">Feasibility — can we act?</text></g>
<path d="M320,250 L320,272 M313,265 L320,272 L327,265" fill="none" stroke="currentColor" stroke-width="2" />
<g><rect x="40" y="275" width="560" height="62" rx="8" fill="none" stroke="currentColor" stroke-width="2"/><text x="320" y="300" text-anchor="middle" font-size="19">Pagkamadalian — kailan kailangan?</text><text x="320" y="322" text-anchor="middle" font-size="16">Urgency — how soon?</text></g>
</svg>
