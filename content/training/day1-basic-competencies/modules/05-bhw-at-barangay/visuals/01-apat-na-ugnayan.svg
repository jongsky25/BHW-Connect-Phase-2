<svg viewBox="0 0 640 400">
  <title>Hub-and-spoke: ang BHW sa gitna, apat na ugnayan sa paligid</title>
  <defs>
    <marker id="role-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" />
    </marker>
  </defs>
  <g>
    <line x1="320" y1="200" x2="320" y2="70" stroke="currentColor" stroke-width="2" marker-end="url(#role-arrow)" />
    <line x1="320" y1="200" x2="470" y2="200" stroke="currentColor" stroke-width="2" marker-end="url(#role-arrow)" />
    <line x1="320" y1="200" x2="320" y2="330" stroke="currentColor" stroke-width="2" marker-end="url(#role-arrow)" />
    <line x1="320" y1="200" x2="170" y2="200" stroke="currentColor" stroke-width="2" marker-end="url(#role-arrow)" />
  </g>
  <g>
    <circle cx="320" cy="200" r="54" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="320" y="200" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700">BHW</text>
  </g>
  <g>
    <circle cx="320" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="320" y="44" text-anchor="middle" dominant-baseline="middle" font-size="12">Komunidad</text>
    <text x="320" y="60" text-anchor="middle" dominant-baseline="middle" font-size="10">(mga pamilya)</text>

    <circle cx="510" cy="200" r="38" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="510" y="194" text-anchor="middle" dominant-baseline="middle" font-size="12">Midwife /</text>
    <text x="510" y="210" text-anchor="middle" dominant-baseline="middle" font-size="12">RHU</text>

    <circle cx="320" cy="350" r="38" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="320" y="344" text-anchor="middle" dominant-baseline="middle" font-size="12">Barangay</text>
    <text x="320" y="360" text-anchor="middle" dominant-baseline="middle" font-size="12">Officials</text>

    <circle cx="130" cy="200" r="38" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="130" y="194" text-anchor="middle" dominant-baseline="middle" font-size="12">Kapwa</text>
    <text x="130" y="210" text-anchor="middle" dominant-baseline="middle" font-size="12">BHW</text>
