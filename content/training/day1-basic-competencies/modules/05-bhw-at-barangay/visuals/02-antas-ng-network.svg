<svg viewBox="0 0 640 400">
  <title>Stack: apat na antas mula barangay hanggang local health board</title>
  <g>
    <rect x="120" y="20" width="400" height="70" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="320" y="48" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700">Barangay</text>
    <text x="320" y="66" text-anchor="middle" dominant-baseline="middle" font-size="10">Punong Barangay, Kagawad sa Kalusugan</text>

    <rect x="90" y="106" width="460" height="70" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="320" y="134" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700">Barangay Health Station</text>
    <text x="320" y="152" text-anchor="middle" dominant-baseline="middle" font-size="10">Midwife (technical supervisor)</text>

    <rect x="60" y="192" width="520" height="70" fill="none" stroke="currentColor" stroke-width="2" />
