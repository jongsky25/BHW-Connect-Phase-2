<svg viewBox="0 0 640 400">
  <title>Contrast: apat na polisiya, dalawang grupo — Bawal kumpara sa Inaatasan</title>
  <g>
    <rect x="30" y="40" width="270" height="320" rx="10" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4" />
    <text x="165" y="75" text-anchor="middle" font-size="16" font-weight="700">Bawal</text>
    <text x="165" y="140" text-anchor="middle" font-size="12">EO 51</text>
    <text x="165" y="158" text-anchor="middle" font-size="10">milk code —</text>
    <text x="165" y="173" text-anchor="middle" font-size="10">bawal i-promote ang</text>
    <text x="165" y="188" text-anchor="middle" font-size="10">milk substitute</text>
    <text x="165" y="240" text-anchor="middle" font-size="12">AO 2015-0053</text>
    <text x="165" y="258" text-anchor="middle" font-size="10">bawal i-promote</text>
    <text x="165" y="273" text-anchor="middle" font-size="10">ang gamot</text>
  </g>
  <g>
    <rect x="340" y="40" width="270" height="320" rx="10" fill="none" stroke="currentColor" stroke-width="2" />
    <text x="475" y="75" text-anchor="middle" font-size="16" font-weight="700">Inaatasan</text>
    <text x="475" y="140" text-anchor="middle" font-size="12">RA 10028</text>
    <text x="475" y="158" text-anchor="middle" font-size="10">isulong ang</text>
    <text x="475" y="173" text-anchor="middle" font-size="10">breastfeeding, magkaroon</text>
    <text x="475" y="188" text-anchor="middle" font-size="10">ng lactation station</text>
    <text x="475" y="240" text-anchor="middle" font-size="12">DC 2021-0486</text>
    <text x="475" y="258" text-anchor="middle" font-size="10">itigil ang single-use</text>
    <text x="475" y="273" text-anchor="middle" font-size="10">plastics</text>
  </g>
</svg>
