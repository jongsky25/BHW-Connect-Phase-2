<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
  <title id="title">Resource trial comparison / Paghahambing ng resource trial</title>
  <desc id="desc">Fictional wrong-version reprints decrease from 20 of 100 to 5 of 100 pages. Before claiming success, compare workload and service quality.</desc>
  <rect width="900" height="410" rx="20" fill="#F4F8F7"/>
  <text x="40" y="50" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#153D51">Fictional trial / Kathang trial</text>
  <g font-family="Arial,sans-serif" fill="#153D51">
    <text x="45" y="110" font-size="19">Before / Dati</text>
    <rect x="260" y="83" width="500" height="34" rx="8" fill="#D5DEE2"/>
    <rect x="260" y="83" width="100" height="34" rx="8" fill="#B75241"/>
    <text x="780" y="109" font-size="19" font-weight="700">20/100</text>
    <text x="45" y="172" font-size="19">After / Pagkatapos</text>
    <rect x="260" y="145" width="500" height="34" rx="8" fill="#D5DEE2"/>
    <rect x="260" y="145" width="25" height="34" rx="8" fill="#0B756F"/>
    <text x="780" y="171" font-size="19" font-weight="700">5/100</text>
  </g>
  <text x="450" y="225" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" font-weight="700" fill="#0B756F">15 fewer reprints per 100 pages / Bawas na 15 sa bawat 100 pahina</text>
  <rect x="40" y="259" width="820" height="112" rx="12" fill="#FFF4DD" stroke="#A96E16" stroke-width="2"/>
  <text x="65" y="300" font-family="Arial,sans-serif" font-size="19" fill="#604410">Before claiming success / Bago sabihing tagumpay:</text>
  <text x="65" y="334" font-family="Arial,sans-serif" font-size="18" fill="#604410">Check session workload, correct materials and delays / Suriin ang workload, materyal at delay</text>
</svg>

