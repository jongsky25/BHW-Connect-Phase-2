<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Resource audit / Pagsusuri ng resources</title>
  <desc id="desc">Three steps: observe waste, check evidence, agree on a safe response. A service and safety gate applies before action.</desc>
  <rect width="900" height="340" rx="20" fill="#F4F8F7"/>
  <text x="40" y="52" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#153D51">Resource audit / Pagsusuri ng resources</text>
  <g font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#153D51">
    <rect x="40" y="92" width="250" height="116" rx="16" fill="#D9EBE7" stroke="#0B756F" stroke-width="2"/>
    <text x="165" y="139" font-weight="700">1. Observe / Obserbahan</text><text x="165" y="170">Leak, printout, stock</text>
    <rect x="325" y="92" width="250" height="116" rx="16" fill="#E6EFF4" stroke="#236782" stroke-width="2"/>
    <text x="450" y="139" font-weight="700">2. Check / Suriin</text><text x="450" y="170">Count, version, cause</text>
    <rect x="610" y="92" width="250" height="116" rx="16" fill="#D9EBE7" stroke="#0B756F" stroke-width="2"/>
    <text x="735" y="139" font-weight="700">3. Act / Kumilos</text><text x="735" y="170">Owner and follow-up</text>
    <text x="306" y="158" font-size="27">→</text><text x="591" y="158" font-size="27">→</text>
  </g>
  <rect x="40" y="238" width="820" height="66" rx="12" fill="#FFF4DD" stroke="#A96E16" stroke-width="2"/>
  <text x="450" y="277" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#604410">Safety and service check / Suriin ang kaligtasan at serbisyo bago kumilos</text>
</svg>

